name: a104-go
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq imagemagick >/dev/null 2>&1
      - name: run
        run: |
          python3 - <<'PY'
          import os,sys,io,csv,zipfile,subprocess,urllib.request
          REPO="sigco3111/assets-3d-lowpoly-2"
          CANDS=[
           {"name":"Mushroom Enemy","slug":"mushroom-enemy","author":"Q2DENJINDREW","page":"https://opengameart.org/content/mushroom-enemy","zip":"fungus.zip","img":"https://opengameart.org/sites/default/files/funny.png"},
           {"name":"Germanic style castle","slug":"germanic-style-castle","author":"_Creature_","page":"https://opengameart.org/content/germanic-style-castle","zip":"germanic_castle.zip","img":"https://opengameart.org/sites/default/files/screenshot_from_2026-09-25_15-02-03_0.png"},
           {"name":"Chibi Neko by cosmix","slug":"chibi-neko-by-cosmix","author":"zodiepupper","page":"https://opengameart.org/content/chibi-neko-by-cosmix","zip":"chibineko.zip","img":"https://opengameart.org/sites/default/files/screenshot_20261029_155124.png"},
          ]
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"vooy-asset-bot/1.0"})
              return urllib.request.urlopen(r,timeout=90).read()
          try:
              cat=get("https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv").decode("utf-8")
              names={row[0].strip().lower() for row in csv.reader(io.StringIO(cat)) if row}
          except Exception as e:
              names=set(); print("catalog read failed:",e)
          lic=get("https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt").decode("utf-8")
          subprocess.run(["git","config","user.name","sigco3111"],check=True)
          subprocess.run(["git","config","user.email","101856311+sigco3111@users.noreply.github.com"],check=True)
          done=[]
          for c in CANDS:
              slug=c["slug"]
              if os.path.isdir(slug) or c["name"].lower() in names:
                  print("SKIP",c["name"]); continue
              os.makedirs(slug)
              data=get("https://opengameart.org/sites/default/files/"+c["zip"])
              zp=os.path.join(slug,c["zip"])
              open(zp,"wb").write(data)
              n=len(zipfile.ZipFile(zp).namelist())
              open(os.path.join(slug,"pack.md"),"w").write(
                "# "+c["name"]+"\n\n- 출처 URL: "+c["page"]+"\n- 받은 파일: "+c["zip"]+" (%.1fMB)\n"%(len(data)/1048576.0)+
                "- 라이선스: CC0\n- 제작자: "+c["author"]+"\n- 파일 수: "+str(n)+"\n- 파일 크기(바이트): "+str(len(data))+
                "\n- 태그: lowpoly,3d\n- AI 생성 여부: 출처 페이지에 언급 없음\n")
              open(os.path.join(slug,"LICENSE-SOURCE.txt"),"w").write(
                c["name"]+"\n\n출처 URL: "+c["page"]+"\n표기 라이선스: CC0\n제작자: "+c["author"]+"\n")
              open(os.path.join(slug,"CREDITS.txt"),"w").write(
                c["name"]+" - "+c["author"]+"\n라이선스: CC0\n출처: "+c["page"]+"\n")
              open(os.path.join(slug,"LICENSE-CC0.txt"),"w").write(lic)
              open("/tmp/srcimg","wb").write(get(c["img"]))
              subprocess.run(["convert","/tmp/srcimg","-resize","800x800>",os.path.join(slug,"preview.png")],check=True)
              subprocess.run(["git","add","-A"],check=True)
              subprocess.run(["git","commit","-m","에셋: "+c["name"]+" 추가"],check=True)
              subprocess.run(["git","push"],check=True)
              done.append(c["name"])
              print("ADDED",c["name"],len(data))
          print("DONE",done)
          PY
