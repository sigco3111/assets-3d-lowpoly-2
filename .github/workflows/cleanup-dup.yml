name: cleanup-dup
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cleanup-dup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify catalog
        run: |
          curl -sSL -o /tmp/catalog.csv https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv
          wc -l /tmp/catalog.csv
          head -1 /tmp/catalog.csv
          python3 - <<'PY'
          import csv
          targets = ["bird-bath", "low-poly-iron-ore", "chibi-neko", "bald-man-rigged"]
          rows = list(csv.DictReader(open("/tmp/catalog.csv", encoding="utf-8-sig")))
          print("ROWS", len(rows))
          print("COLUMNS", list(rows[0].keys()))
          blocked = []
          for r in rows:
              repo = str(r.get("repo") or "")
              blob = " ".join(str(x) for x in r.values())
              if any(t in blob for t in targets):
                  print("MATCH", r)
              if "assets-3d-lowpoly-2" in repo:
                  for col, val in r.items():
                      if not val:
                          continue
                      parts = str(val).replace("\\", "/").split("/")
                      for t in targets:
                          if t in parts:
                              blocked.append((t, col, val))
          print("BLOCKED", blocked)
          if blocked:
              raise SystemExit("BLOCKED: catalog.csv references these paths")
          PY
      - name: delete duplicates
        run: |
          git rm -r --ignore-unmatch bird-bath low-poly-iron-ore chibi-neko bald-man-rigged
          git rm --ignore-unmatch previews/bird-bath.png previews/low-poly-iron-ore.png previews/chibi-neko.png previews/bald-man-rigged.png
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git commit -m "정리: 중복 폴더 삭제"
          git push
