{"name":"tmp-up-probe2","on":{"workflow_dispatch":{}},"jobs":{"probe":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"run":"S=$GITHUB_STEP_SUMMARY; t(){ sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -oiE '.{0,200}(cc0|creative commons|public domain|licen[cs]e).{0,200}' | head -3 | cut -c1-400; }; echo '## KENNEY' >> $S; curl -sL -A 'Mozilla/5.0' https://kenney.nl/assets/platformer-kit -o /tmp/k.html; echo kenney_page $(wc -c < /tmp/k.html) >> $S; grep -oE 'https[^ <>]*[.]zip' /tmp/k.html | sort -u | head -3 >> $S; Z=$(grep -oE 'https[^ <>]*[.]zip' /tmp/k.html | head -1); curl -sIL -A 'Mozilla/5.0' \"$Z\" | grep -iE '^(HTTP|content-length)' | tail -2 >> $S; echo '## KENNEY_GH' >> $S; curl -sL https://api.github.com/repos/ETdoFresh/kenney.nl | grep -oE '\"(size|pushed_at)\": *\"?[^,]*' | head -2 >> $S; echo '## QUATERNIUS' >> $S; curl -sL -A 'Mozilla/5.0' https://quaternius.com/license.html -o /tmp/q.html; echo q_license $(wc -c < /tmp/q.html) >> $S; t < /tmp/q.html >> $S; curl -sL -A 'Mozilla/5.0' https://quaternius.com/ -o /tmp/q2.html; grep -oE 'https[^ <>]*[.]zip' /tmp/q2.html | sort -u | head -3 >> $S; echo '## KAYKIT' >> $S; for r in KayKit-Dungeon-Remastered-1.0 KayKit-Prototype-Bits-1.0; do curl -sL https://api.github.com/repos/KayKit-Game-Assets/$r -o /tmp/r.json; grep -oE '\"(license|size|pushed_at)\": *[^,]*' /tmp/r.json | head -4 >> $S; curl -sL https://api.github.com/repos/KayKit-Game-Assets/$r/contents -o /tmp/c.json; grep -oE '\"name\": *\"[^\"]*\"' /tmp/c.json | head -12 | tr '\\n' ' ' >> $S; echo >> $S; done; curl -sL -A 'Mozilla/5.0' https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0/main/LICENSE.txt -o /tmp/kl.txt; echo kl_bytes $(wc -c < /tmp/kl.txt) >> $S; head -c 500 /tmp/kl.txt >> $S; echo >> $S; echo '## POLYHAVEN' >> $S; curl -sL -A 'Mozilla/5.0' https://polyhaven.com/license -o /tmp/ph.html; t < /tmp/ph.html >> $S; echo '## AMBIENTCG' >> $S; curl -sL -A 'Mozilla/5.0' https://ambientcg.com/license -o /tmp/a.html; echo a_license $(wc -c < /tmp/a.html) >> $S; t < /tmp/a.html >> $S; curl -sIL -A 'Mozilla/5.0' 'https://ambientcg.com/get?file=Bricks037_1K-JPG.zip' | grep -iE '^(HTTP|content-length)' | tail -2 >> $S; echo '## POLYPIZZA' >> $S; curl -sL -A 'Mozilla/5.0' https://poly.pizza/terms -o /tmp/pt.html; echo pt $(wc -c < /tmp/pt.html) >> $S; t < /tmp/pt.html >> $S; echo '## CATALOG' >> $S; curl -sL https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv -o /tmp/cat.csv; echo bytes $(wc -c < /tmp/cat.csv) rows $(wc -l < /tmp/cat.csv) >> $S; for k in kenney quaternius kaykit poly.pizza polyhaven ambientcg opengameart OGA-BY CC0; do echo $k $(grep -ic \"$k\" /tmp/cat.csv) >> $S; done; echo '## REPO SIZES' >> $S; for r in assets-3d-lowpoly-2 assets-2d-pixel assets-audio game-asset-catalog; do echo $r $(curl -sL https://api.github.com/repos/sigco3111/$r | grep -oE '\"size\": *[0-9]+') >> $S; done"}]}}}
