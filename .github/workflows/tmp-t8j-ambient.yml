name: tmp-t8j-ambient
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > collect.py <<'PYEOF'
          import os, io, re, json, zipfile, subprocess, urllib.request
          from PIL import Image
          IDS = ["Wood099","Wood098","Wood097","Metal064","Planks040","Bark016","Bricks113A","Clay009"]
          LIM = 5*1024*1024
          TODAY = "2026-11-27"
          def sh(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              print(r.stdout[-300:], r.stderr[-300:], flush=True)
              return r.returncode
          def disp(i):
              m = re.match(r"([A-Za-z]+)(\d+[A-Za-z]?)$", i)
              return m.group(1) + " " + m.group(2)
          done = []
          for i in IDS:
              slug = "ambientcg-" + i.lower()
              zname = slug + ".zip"
              req = urllib.request.Request("https://ambientcg.com/get?file=" + i + "_1K-JPG.zip", headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=180).read()
              print(i, len(data), flush=True)
              z = zipfile.ZipFile(io.BytesIO(data))
              col = [n for n in z.namelist() if "Color" in n and n.lower().endswith(".jpg")][0]
              im = Image.open(io.BytesIO(z.read(col))).convert("RGB")
              im.thumbnail((512, 512))
              b = io.BytesIO(); im.save(b, "PNG", optimize=True)
              os.makedirs(slug, exist_ok=True)
              open(os.path.join(slug, "preview.png"), "wb").write(b.getvalue())
              if len(data) > LIM:
                  tag = "pack-" + slug
                  open(zname, "wb").write(data)
                  sh("gh release create " + tag + " --title " + tag + " --notes 'Asset pack zip' || true")
                  sh("gh release upload " + tag + " " + zname + " --clobber")
                  os.remove(zname)
                  fcol = "release:" + tag + "/" + zname
              else:
                  open(os.path.join(slug, zname), "wb").write(data)
                  fcol = slug + "/" + zname
              meta = {"name": "ambientCG " + disp(i), "slug": slug, "zip": zname, "file": fcol, "author": "ambientCG",
                  "url": "https://ambientcg.com/a/" + i, "license": "CC0",
                  "attr": disp(i) + " by ambientCG (https://ambientcg.com/a/" + i + "), CC0", "date": TODAY,
                  "tags": "texture,ambientcg,pbr,cc0", "notes": "ambientCG 1K-JPG PBR 텍스처 zip. 라이선스 CC0 (docs.ambientcg.com/license 확인)",
                  "preview": "preview.png", "kind": "텍스처"}
              open(os.path.join(slug, "meta.json"), "w", encoding="utf-8").write(json.dumps(meta, ensure_ascii=False, indent=1))
              open(os.path.join(slug, "LICENSE.txt"), "w", encoding="utf-8").write("CC0 1.0 Universal\nambientCG " + i + ": https://ambientcg.com/a/" + i + "\n")
              done.append(slug)
          sh("git config user.name github-actions && git config user.email actions@github.com")
          sh("git add " + " ".join(done) + " && git commit -m 'ambientCG 8종 수집 (웹 탐색 t8j)' && git push origin HEAD:main")
          
          PYEOF
          python3 collect.py
