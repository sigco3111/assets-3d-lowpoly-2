name: collect-th
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-th.yml]
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: gdown public folder once
        run: |
          python3 - <<'PY'
          import re, subprocess, os, glob
          subprocess.run(['pip','install','-q','gdown'], check=False)
          os.makedirs('/tmp/tanks', exist_ok=True)
          FOLDER='https://drive.google.com/drive/folders/1tHX0RF9l4Nw4EZwxH6xWta0HsICU2h-G?usp=sharing'
          p = subprocess.run(['gdown','--folder',FOLDER,'-O','/tmp/tanks'], capture_output=True, text=True, timeout=900)
          out = (p.stdout + p.stderr)
          for ln in out.split('\n'):
              if re.search(r'quota|too many|sign in|login|captcha|denied|error|Failed|Access', ln, re.I):
                  print('::notice::H2 msg ' + ln[:150])
          files = [f for f in glob.glob('/tmp/tanks/**/*', recursive=True) if os.path.isfile(f)]
          print('::notice::H2 rc=%d files=%d total_bytes=%d' % (p.returncode, len(files), sum(os.path.getsize(f) for f in files)))
          for f in sorted(files)[:30]:
              print('::notice::H2 file %s %d' % (f.replace('/tmp/tanks/',''), os.path.getsize(f)))
          
          PY
