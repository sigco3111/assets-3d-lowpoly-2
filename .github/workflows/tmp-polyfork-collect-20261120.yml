{"name":"polyfork-trial-collect","on":{"push":{"paths":["triggers/polyfork-run.txt"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"c":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"collect","run":"pip install trimesh numpy matplotlib pillow\npython3 - <<'PY'\nimport json,os,io,zipfile,urllib.request,datetime,subprocess\nimport numpy as np, trimesh\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nfrom mpl_toolkits.mplot3d.art3d import Poly3DCollection\nNL=chr(10)\nITEMS=[('runway-tile-9a2808','Runway Tile'),('stone-flagged-courtyard-tile-529c20','Stone-Flagged Courtyard Tile'),('tree-stump-00f3bf','Tree Stump')]\nLIC=open('3d-donut/LICENSE.txt',encoding='utf-8').read()\ntoday=datetime.date.today().isoformat()\nsubprocess.run(['git','config','user.name','github-actions[bot]'],check=True)\nsubprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)\nout=[]\nfor pid,title in ITEMS:\n    slug=title.lower().replace(' ','-')\n    assert not os.path.exists(slug), 'exists '+slug\n    req=urllib.request.Request('https://polyfork.dev/cdn/%s.glb'%pid,headers={'User-Agent':'Mozilla/5.0'})\n    data=urllib.request.urlopen(req,timeout=60).read()\n    assert 0<len(data)<25000000\n    scene=trimesh.load(io.BytesIO(data),file_type='glb',force='scene')\n    mesh=scene.dump(concatenate=True)\n    v=np.asarray(mesh.vertices,dtype=float); f=np.asarray(mesh.faces)\n    P=np.stack([v[:,0],-v[:,2],v[:,1]],axis=1)\n    P=P-(P.max(0)+P.min(0))/2\n    ext=P.max(0)-P.min(0)\n    P=P/max(ext.max(),1e-6)\n    try:\n        fc=np.asarray(mesh.visual.to_color().face_colors,dtype=float)[:,:3]/255.0\n    except Exception:\n        fc=np.full((len(f),3),0.7)\n    n=np.asarray(mesh.face_normals,dtype=float)\n    n=np.stack([n[:,0],-n[:,2],n[:,1]],axis=1)\n    L=np.array([0.4,-0.5,0.8]); L=L/np.linalg.norm(L)\n    k=0.45+0.55*np.clip(n@L,0,1)\n    cols=np.clip(fc*k[:,None],0,1)\n    fig=plt.figure(figsize=(6,6),dpi=100)\n    ax=fig.add_subplot(111,projection='3d')\n    ax.add_collection3d(Poly3DCollection(P[f],facecolors=cols,edgecolors='none'))\n    ax.set_xlim(-0.6,0.6); ax.set_ylim(-0.6,0.6); ax.set_zlim(-0.6,0.6)\n    ax.set_box_aspect((1,1,1)); ax.view_init(elev=28,azim=-55); ax.set_axis_off()\n    os.makedirs(slug)\n    fig.savefig(slug+'/preview.png',dpi=100,facecolor='white'); plt.close(fig)\n    psz=os.path.getsize(slug+'/preview.png')\n    assert psz<1000000, 'preview too big'\n    with zipfile.ZipFile(slug+'/'+slug+'.zip','w',zipfile.ZIP_DEFLATED) as z:\n        z.writestr(slug+'.glb',data)\n    attr='%s by Polyfork (https://polyfork.dev/asset/%s), CC BY 4.0'%(title,pid)\n    url='https://polyfork.dev/asset/'+pid\n    meta={'name':title,'slug':slug,'zip':slug+'.zip','file':slug+'/'+slug+'.zip','author':'Polyfork','url':url,'license':'CC-BY 4.0','attr':attr,'date':today,'tags':'3d,polyfork,lowpoly','notes':'Polyfork 무료 모델, 메시(GLB)는 CC BY 4.0 선택 (https://polyfork.dev/licensing 확인); 미리보기는 GLB 를 러너에서 직접 렌더; 시험 수집 3개','preview':'preview.png','kind':'3D 모델'}\n    open(slug+'/meta.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=1))\n    open(slug+'/LICENSE.txt','w',encoding='utf-8').write(LIC)\n    open(slug+'/LICENSE-SOURCE.txt','w',encoding='utf-8').write('Source: '+url+NL+'License: CC-BY 4.0 (Polyfork 무료 모델 메시 파일, CC BY 4.0 선택)'+NL+'Checked: '+today+' (GitHub Actions runner, https://polyfork.dev/licensing)'+NL+'Note: 썸네일/렌더/HD/mjs 는 CC BY 범위 밖이라 포함하지 않음')\n    open(slug+'/CREDITS.txt','w',encoding='utf-8').write(title+NL+'제작자: Polyfork'+NL+'출처: '+url+NL+'라이선스: CC-BY 4.0'+NL+'표기: '+attr)\n    open(slug+'/pack.md','w',encoding='utf-8').write('# '+title+NL+NL+'- 라이선스: CC-BY 4.0'+NL+'- 출처: '+url+NL+'- 제작자: Polyfork'+NL+'- 수집일: '+today+' (Polyfork 시험 수집, 자동)'+NL+'- 파일: '+slug+'.zip (GLB 포함)'+NL+'- 저장: 저장소 트리 '+slug+'/'+slug+'.zip'+NL+'- 미리보기: GLB 를 러너에서 직접 렌더')\n    subprocess.run(['git','add',slug],check=True)\n    subprocess.run(['git','commit','-m','에셋: '+title+' 추가'],check=True)\n    out.append('%s glb=%d zip=%d preview=%d tris=%d'%(slug,len(data),os.path.getsize(slug+'/'+slug+'.zip'),psz,len(f)))\nos.makedirs('docs',exist_ok=True)\nopen('docs/polyfork-run-20261120.md','w',encoding='utf-8').write(NL.join(out)+NL)\nsubprocess.run(['git','add','docs/polyfork-run-20261120.md'],check=True)\nsubprocess.run(['git','commit','-m','tmp: polyfork 시험 수집 산출물'],check=True)\nsubprocess.run(['git','pull','--rebase'],check=True)\nsubprocess.run(['git','push'],check=True)\nprint(NL.join(out))\nPY\n"}]}}}
