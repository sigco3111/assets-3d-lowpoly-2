name: tmp-t9l-batch
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          TODAY=$(date -u +%F)
          REPO=sigco3111/assets-3d-lowpoly-2
          curl -sfL https://raw.githubusercontent.com/$REPO/main/polyhaven-weathered-pvc-tank/LICENSE.txt -o /tmp/lic_base.txt
          mk_lic() { sed -e "s|^Source:.*|Source: $4|" -e "s|^Author:.*|Author: $2|" -e "s|^Checked:.*|Checked: $TODAY (GitHub Actions runner)|" /tmp/lic_base.txt > "$3/LICENSE.txt"; }
          for n in Bricks106A Bricks106B Bricks107A Bricks107B Bricks108A Bricks108B Bricks109A Bricks109B Bricks110A Bricks110B Bricks111A Bricks111B Bricks112A Bricks112B Clay007 Clay008; do
            s=$(echo $n | tr A-Z a-z); d=ambientcg-$s; tag=pack-$d; mkdir -p $d
            curl -sfL "https://ambientcg.com/get?file=${n}_1K-JPG.zip" -o /tmp/$d.zip || { echo FAIL dl $n; continue; }
            rm -rf /tmp/x; mkdir /tmp/x; unzip -qj /tmp/$d.zip "*Color*.jpg" -d /tmp/x || true; c=$(ls /tmp/x/*.jpg | head -1)
            convert "$c" -resize 256x256 $d/preview.png || { echo FAIL prev $n; continue; }
            mk_lic x ambientCG $d "https://ambientcg.com/a/$n"
            gh release create $tag /tmp/$d.zip --repo $REPO --title $tag --notes "ambientCG $n 1K-JPG, CC0" || { echo FAIL rel $n; continue; }
            jq -n --arg name "ambientCG $n" --arg slug $d --arg zip $d.zip --arg file "release:$tag/$d.zip" --arg url "https://ambientcg.com/a/$n" --arg date $TODAY --arg attr "$n by ambientCG (https://ambientcg.com/a/$n), CC0" '{name:$name,slug:$slug,zip:$zip,file:$file,author:"ambientCG",url:$url,license:"CC0",attr:$attr,date:$date,tags:"texture,ambientcg,pbr,cc0",notes:"ambientCG 1K-JPG PBR zip. CC0 (docs.ambientcg.com/license)",preview:"preview.png",kind:"텍스처"}' > $d/meta.json
            rm -f /tmp/$d.zip
          done
          for id in highway_bridge_sunset aarfontein_dawn_2 aarfontein_sunrise aarfontein_pan nqweba_dawn nowhere_road waterkloof_farm toposcope_sunset ushaka_dolphin_stadium penguin_museum malagas_ferry_road donkin_reserve ladybrand_heritage_house camdeboo_road white_chapel; do
            d=polyhaven-$(echo $id | tr _ -); mkdir -p $d
            j=$(curl -sfL https://api.polyhaven.com/files/$id)
            author=$(curl -sfL https://api.polyhaven.com/info/$id | jq -r '.authors|keys|join(", ")')
            u=$(echo "$j" | jq -r '.hdri["1k"].hdr.url'); hf=$(basename $u); curl -sfL "$u" -o $d/$hf || { echo FAIL hdr $id; continue; }
            curl -sfL "https://cdn.polyhaven.com/asset_img/thumbs/$id.png?height=256" -o $d/preview.png
            mk_lic x "$author" $d "https://polyhaven.com/a/$id"
            name=$(echo $id | tr _ " " | sed "s/\b\(.\)/\u\1/g")
            jq -n --arg name "Poly Haven $name" --arg slug $d --arg zip $hf --arg file "$d/$hf" --arg author "$author" --arg url "https://polyhaven.com/a/$id" --arg date $TODAY --arg attr "Poly Haven $name by $author (https://polyhaven.com/a/$id), CC0" '{name:$name,slug:$slug,zip:$zip,file:$file,author:$author,url:$url,license:"CC0",attr:$attr,date:$date,tags:"hdri,polyhaven,sky,cc0",notes:"Poly Haven 1K HDR 환경맵. CC0",preview:"preview.png",kind:"HDRI"}' > $d/meta.json
          done
          git config user.name github-actions; git config user.email actions@github.com
          git add ambientcg-*/ polyhaven-*/ && (git commit -m "웹 탐색 t9l: ambientCG 16팩 + Poly Haven HDRI 15팩 (1K)" || echo nothing)
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          git log -1 --oneline
