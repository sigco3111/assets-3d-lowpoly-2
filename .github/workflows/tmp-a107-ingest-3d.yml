name: tmp-a107-ingest-3d
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: "3d"
      COUNT: "3"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq imagemagick >/dev/null 2>&1; true
      - name: ingest
        run: |
          python3 - <<'PY'
          import os, re, io, csv, json, shutil, subprocess, urllib.request, urllib.parse, html, datetime
          UA = 'vooy-asset-bot/1.0'
          OWNER = 'sigco3111'
          REPO = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          MODE = os.environ.get('MODE', '3d')
          COUNT = int(os.environ.get('COUNT', '3'))
          KST = datetime.timezone(datetime.timedelta(hours=9))
          TODAY = datetime.datetime.now(KST).strftime('%Y-%m-%d')
          TYPE_LABEL = '3D 모델' if MODE == '3d' else '2D 이펙트'
          RAW = 'https://raw.githubusercontent.com/%s/%s/main/' % (OWNER, REPO)
          RELBASE = 'https://github.com/%s/%s/releases/download/' % (OWNER, REPO)
          BASE = 'https://opengameart.org/art-search-advanced?'
          LIST3D = [BASE + q for q in ['keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=created&sort_order=DESC', 'keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=created&sort_order=DESC&page=1', 'keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=count&sort_order=DESC', 'keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=count&sort_order=DESC&page=1']]
          FXKW = ['hit effect', 'magic spell', 'slash effect', 'impact effect', 'explosion effect', 'fire spell', 'heal spell', 'sword slash', 'spell effect', 'magic effect']
          LISTFX = [BASE + 'keys=' + urllib.parse.quote_plus(k) + '&field_art_licenses_tid[]=4&sort_by=created&sort_order=DESC' for k in FXKW]
          LIC_URL = {'CC0': 'https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt', 'CC-BY 3.0': 'https://creativecommons.org/licenses/by/3.0/legalcode.txt', 'CC-BY 4.0': 'https://creativecommons.org/licenses/by/4.0/legalcode.txt', 'GPL 2.0': 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt', 'GPL 3.0': 'https://www.gnu.org/licenses/gpl-3.0.txt'}
          LIC_FILE = {'CC0': 'LICENSE-CC0.txt', 'CC-BY 3.0': 'LICENSE-CC-BY-3.0.txt', 'CC-BY 4.0': 'LICENSE-CC-BY-4.0.txt', 'GPL 2.0': 'LICENSE-GPL-2.0.txt', 'GPL 3.0': 'LICENSE-GPL-3.0.txt'}
          LPAT = r'CC0|CC-?BY[ -]?(3\.0|4\.0)|CC-?BY|MIT|GPL ?(?:v|version )?([23])(?:\.0)?'
          MAXB = 25 * 1024 * 1024
          BIG = 5 * 1024 * 1024

          def get(u, method='GET'):
              r = urllib.request.Request(u, headers={'User-Agent': UA}, method=method)
              with urllib.request.urlopen(r, timeout=180) as resp:
                  data = b'' if method == 'HEAD' else resp.read()
                  return resp.status, resp.geturl(), dict(resp.headers), data

          def txt(u):
              return get(u)[3].decode('utf-8', 'replace')

          def sh(*a):
              return subprocess.run(list(a), check=True)

          def listslugs(urls):
              out = []
              for u in urls:
                  try:
                      page = txt(u)
                  except Exception as e:
                      print('LIST ERR', repr(e)[:150], u[-60:])
                      continue
                  for m in re.finditer(r'href="/content/([A-Za-z0-9_\-]+)"', page):
                      s = m.group(1)
                      if 'faq' in s or s in out:
                          continue
                      out.append(s)
                  print('LIST ok', len(page), u[-60:])
              return out

          cat = txt('https://raw.githubusercontent.com/%s/game-asset-catalog/main/catalog.csv' % OWNER)
          rows = list(csv.reader(io.StringIO(cat)))
          names = set()
          slugs = set()
          for r in rows:
              if r and r[0].strip():
                  names.add(r[0].strip().lower())
              for m in re.finditer(r'opengameart\.org/content/([A-Za-z0-9_\-]+)', ','.join(r)):
                  slugs.add(m.group(1).lower())
          print('CATALOG rows=%d names=%d oga_slugs=%d' % (len(rows), len(names), len(slugs)))
          EXCL = set(listslugs(LIST3D)) if MODE == 'fx' else set()
          cands = [s for s in (listslugs(LIST3D) if MODE == '3d' else listslugs(LISTFX)) if s not in EXCL]
          print('CANDIDATES', len(cands), ' '.join(cands))

          def license_of(seg):
              if not seg:
                  return None, 'no License(s) text'
              if re.search(r'\bSA\b|SHARE ?ALIKE|\bNC\b|NON-?COMMERCIAL|\bND\b|NO-?DERIV|OGA-BY|OGA BY', seg, re.I):
                  return None, 'restricted license: ' + seg[:80]
              found = []
              for m in re.finditer(LPAT, seg, re.I):
                  tok = m.group(0).upper()
                  if tok == 'CC0':
                      c = 'CC0'
                  elif tok == 'MIT':
                      c = 'MIT'
                  elif tok.startswith('CC'):
                      if not m.group(1):
                          return None, 'CC-BY version unclear: ' + seg[:80]
                      c = 'CC-BY ' + m.group(1)
                  else:
                      c = 'GPL %s.0' % m.group(2)
                  if c not in found:
                      found.append(c)
              rest = re.sub(LPAT, ' ', seg, flags=re.I)
              rest = re.sub(r'\b(?:GNU|GENERAL|PUBLIC|LICENSE|AND|OR|VERSION|V)\b|[\s,;:/()"&.\-]', ' ', rest, flags=re.I)
              if not found or re.search(r'[A-Za-z0-9]', rest):
                  return None, 'unclear license: ' + seg[:80]
              return found, None

          def page_info(slug):
              st, u, hd, data = get('https://opengameart.org/content/' + slug)
              p = data.decode('utf-8', 'replace')
              t = re.search(r'<title[^>]*>(.*?)</title>', p, re.S | re.I)
              title = html.unescape(t.group(1)).split(' | ')[0].strip() if t else slug
              flat = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', p)))
              k = 'License(s):'
              i = flat.find(k)
              seg = flat[i + len(k):i + len(k) + 160] if i >= 0 else ''
              m = re.search(r'\b(Collections|Preview|Submitted|Art Type|Tags|Attribution|Author|Description|Download|Comments)\b', seg)
              if m:
                  seg = seg[:m.start()]
              return p, u, title, flat, seg.strip()

          def process(slug):
              if slug.lower() in slugs:
                  return None, 'already in catalog (OGA slug)'
              if os.path.isdir(slug):
                  return None, 'folder exists'
              p, u, title, flat, seg = page_info(slug)
              if title.lower() in names:
                  return None, 'name already in catalog: ' + title
              lic, why = license_of(seg)
              if lic is None:
                  return None, why
              if MODE == 'fx':
                  am = re.search(r'Art Type[^:]{0,12}:\s*(.{0,60})', flat)
                  at = am.group(1) if am else ''
                  if not re.search(r'2D|sprite|pixel|image', at, re.I):
                      return None, 'art type not 2D (%r)' % at[:40]
              if 'MIT' in lic:
                  return None, 'MIT: no fixed text generated'
              am2 = re.search(r'href="/users/[^"]+"[^>]*>\s*([^<]+?)\s*</a>', p)
              author = am2.group(1).strip() if am2 else 'unknown'
              files = []
              for h in re.findall(r'href="([^"]+)"', p):
                  if '/sites/default/files/' in h and re.search(r'\.zip(\?|$)', h, re.I):
                      full = urllib.parse.urljoin(u, html.unescape(h))
                      if full not in files:
                          files.append(full)
              if not files:
                  return None, 'no zip attachment'
              if len(files) > 1:
                  return None, 'multiple zip attachments: %d' % len(files)
              zurl = files[0]
              zname = urllib.parse.unquote(zurl.split('/')[-1].split('?')[0])
              _, _, hh, _ = get(zurl, 'HEAD')
              clen = int(hh.get('Content-Length') or 0)
              if clen > MAXB:
                  return None, 'zip %d bytes > 25MB (skipped)' % clen
              _, _, _, zdata = get(zurl)
              if len(zdata) > MAXB:
                  return None, 'zip > 25MB (skipped)'
              imgs = []
              og = re.search(r'<meta property="og:image" content="([^"]+)"', p)
              if og:
                  imgs.append(html.unescape(og.group(1)))
              for h in re.findall(r'src="([^"]+)"', p):
                  if '/sites/default/files/' in h and re.search(r'\.(png|jpe?g|gif)(\?|$)', h, re.I):
                      imgs.append(urllib.parse.urljoin(u, html.unescape(h)))
              prev = None
              for im in imgs:
                  try:
                      idata = get(im)[3]
                  except Exception as e:
                      print('  img err', repr(e)[:100])
                      continue
                  if len(idata) > 2000:
                      prev = '/tmp/prev_' + slug
                      open(prev, 'wb').write(idata)
                      break
              if prev is None:
                  return None, 'no preview image'
              return dict(slug=slug, title=title, page=u, author=author, lic=lic, seg=seg, zurl=zurl, zname=zname, size=len(zdata), zdata=zdata, prev=prev), None

          def build(info):
              slug = info['slug']
              title = info['title']
              os.makedirs(slug)
              zipname = slug + '.zip'
              zpath = os.path.join(slug, zipname)
              open(zpath, 'wb').write(info['zdata'])
              info['zdata'] = None
              for L in info['lic']:
                  body = txt(LIC_URL[L])
                  if len(body) < 300:
                      raise Exception('short license text ' + L)
                  open(os.path.join(slug, LIC_FILE[L]), 'w', encoding='utf-8').write(body)
              sh('convert', info['prev'] + '[0]', '-resize', '800x800>', os.path.join(slug, 'preview.png'))
              use_rel = info['size'] > BIG
              if use_rel:
                  tag = 'a107-' + slug
                  sh('gh', 'release', 'create', tag, '-t', tag, '-n', title, '-R', OWNER + '/' + REPO)
                  sh('gh', 'release', 'upload', tag, zpath, '-R', OWNER + '/' + REPO)
                  os.remove(zpath)
                  zloc = RELBASE + tag + '/' + zipname
                  storage = 'GitHub Releases ' + tag
              else:
                  zloc = slug + '/' + zipname
                  storage = '저장소 트리'
              lic_txt = ' / '.join(info['lic'])
              seg = info['seg']
              md = '# %s\n\n- 출처 URL: %s\n- 원본 첨부 파일: %s (%d바이트)\n- 라이선스: %s (출처 페이지 License(s): "%s")\n- 제작자: %s\n- 종류: %s\n- zip 크기(바이트): %d\n- 보관: %s\n- AI 생성 여부: 출처 페이지에 언급 없음\n' % (title, info['page'], info['zname'], info['size'], lic_txt, seg, info['author'], TYPE_LABEL, info['size'], storage)
              open(os.path.join(slug, 'pack.md'), 'w', encoding='utf-8').write(md)
              now = datetime.datetime.now(KST).strftime('%Y-%m-%d %H:%M')
              open(os.path.join(slug, 'LICENSE-SOURCE.txt'), 'w', encoding='utf-8').write('%s\n\n출처 URL: %s\n확인 시각: %s KST (GitHub Actions 러너에서 출처 페이지 확인)\n출처 페이지 License(s) 원문: %s\n판정 라이선스: %s\n제작자: %s\n' % (title, info['page'], now, seg, lic_txt, info['author']))
              open(os.path.join(slug, 'CREDITS.txt'), 'w', encoding='utf-8').write('%s - %s\n라이선스: %s\n출처: %s\n' % (title, info['author'], lic_txt, info['page']))
              sh('git', 'add', '-A')
              sh('git', 'commit', '-m', '에셋: %s 추가' % title)
              sh('git', 'push')
              words = [w for w in slug.split('-') if len(w) > 2][:4]
              tags = ','.join(words + (['lowpoly', '3d'] if MODE == '3d' else ['effect', '2d', 'pixel']))
              return dict(name=title, slug=slug, repo=REPO, zip=zloc, type=TYPE_LABEL, tags=tags, author=info['author'], source=info['page'], lic=lic_txt, date=TODAY, size=info['size'], storage=storage, preview=RAW + slug + '/preview.png', note='출처 페이지 License(s)=%s 확인(%s); 첨부 zip %s(%d바이트); preview.png 썸네일; 저장: %s' % (lic_txt, TODAY, info['zname'], info['size'], storage))

          sh('git', 'config', 'user.name', OWNER)
          sh('git', 'config', 'user.email', '101856311+sigco3111@users.noreply.github.com')
          added = []
          for slug in cands:
              if len(added) >= COUNT:
                  break
              try:
                  info, why = process(slug)
              except Exception as e:
                  print('SKIP', slug, 'error', repr(e)[:160])
                  continue
              if info is None:
                  print('SKIP', slug, '-', why)
                  continue
              try:
                  rec = build(info)
              except Exception as e:
                  print('FAIL', slug, repr(e)[:200])
                  shutil.rmtree(slug, ignore_errors=True)
                  continue
              names.add(info['title'].lower())
              slugs.add(slug.lower())
              added.append(rec)
              print('MANIFEST ' + json.dumps(rec, ensure_ascii=False))
          print('ADDED', len(added), 'of', COUNT)

          PY
