name: a106-3d4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq imagemagick >/dev/null 2>&1
      - name: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/l.txt 2>&1 || true
          import os,io,csv,re,zipfile,subprocess,urllib.request,urllib.parse
          C=[
           {"name":"Low Poly Mushroom Kit","slug":"low-poly-mushroom-kit","author":"AssetQuest","page":"https://opengameart.org/content/low-poly-mushroom-kit","files":["https://opengameart.org/sites/default/files/free%5Fmushroom%5Fpack%5Fassetquest.zip"],"img":"https://opengameart.org/sites/default/files/thumb_new.jpg","tags":"3d,lowpoly,mushroom,nature"},
           {"name":"Low Poly Halloween Kit","slug":"low-poly-halloween-kit","author":"AssetQuest","page":"https://opengameart.org/content/low-poly-halloween-kit","files":["https://opengameart.org/sites/default/files/free%5Fhalloween%5Fkit%5Fassetquest.zip"],"img":"https://opengameart.org/sites/default/files/thumb_overview.jpg","tags":"3d,lowpoly,halloween,prop"},
           {"name":"Aztec Buildings","slug":"aztec-buildings","author":"Kuvrot","page":"https://opengameart.org/content/aztec-buildings","files":["https://opengameart.org/sites/default/files/buildings%5F2.zip"],"img":"https://opengameart.org/sites/default/files/303821791-f831e7bf-747e-4bb8-a87a-fae3d0bd3ca0.jpg","tags":"3d,lowpoly,building,aztec"},
           {"name":"50 Bottles (3D)","slug":"50-bottles-3d","author":"Lyricsz","page":"https://opengameart.org/content/50-bottles-3d","files":["https://opengameart.org/sites/default/files/50%5Fbottles.zip"],"img":"https://opengameart.org/sites/default/files/spritesheet_81.png","tags":"3d,lowpoly,prop,bottle"},
           {"name":"10x Blocky Character Bundle","slug":"10x-blocky-character-bundle","author":"Lyricsz","page":"https://opengameart.org/content/10x-blocky-character-bundle","files":["https://opengameart.org/sites/default/files/character-bundle.zip"],"img":"https://opengameart.org/sites/default/files/cover-bundle.png","tags":"3d,lowpoly,character"},
           {"name":"Fantasy Props MegaKit","slug":"fantasy-props-megakit","author":"quaternius","page":"https://opengameart.org/content/fantasy-props-megakit","files":["https://opengameart.org/sites/default/files/fantasy%5Fprops%5Fmegakitstandard.zip"],"img":"https://opengameart.org/sites/default/files/preview_fantasyprops.jpg","tags":"3d,lowpoly,props,fantasy"},
           {"name":"Holiday Kit","slug":"holiday-kit","author":"Kenney","page":"https://opengameart.org/content/holiday-kit","files":["https://opengameart.org/sites/default/files/kenney%5Fholiday-kit.zip"],"img":"https://opengameart.org/sites/default/files/preview_1294.png","tags":"3d,lowpoly,holiday,christmas"},
           {"name":"Coaster Kit","slug":"coaster-kit","author":"Kenney","page":"https://opengameart.org/content/coaster-kit","files":["https://opengameart.org/sites/default/files/kenney%5Fcoaster-kit.zip"],"img":"https://opengameart.org/sites/default/files/preview_1289.png","tags":"3d,lowpoly,themepark,ride"},
           {"name":"Low Poly Spaceship","slug":"low-poly-spaceship","author":"tbbk","page":"https://opengameart.org/content/low-poly-spaceship-0","files":["https://opengameart.org/sites/default/files/spaceship%5F3.zip"],"img":"https://opengameart.org/sites/default/files/spaceship_1_0.png","tags":"3d,lowpoly,spaceship,sci-fi"},
           {"name":"Voxel Classical Guitar","slug":"voxel-classical-guitar","author":"MonoTone","page":"https://opengameart.org/content/voxel-classical-guitar","files":["https://opengameart.org/sites/default/files/voxelclassicalguitar.zip"],"img":"https://opengameart.org/sites/default/files/preview_1288.png","tags":"3d,voxel,instrument"},
           {"name":"Modular Dungeon Kit","slug":"modular-dungeon-kit","author":"Kenney","page":"https://opengameart.org/content/modular-dungeon-kit","files":["https://opengameart.org/sites/default/files/kenney%5Fmodular-dungeon-kit%5F2.0.zip"],"img":"https://opengameart.org/sites/default/files/preview_1362.png","tags":"3d,lowpoly,dungeon,modular"},
           {"name":"Graveyard Kit","slug":"graveyard-kit","author":"Kenney","page":"https://opengameart.org/content/graveyard-kit","files":["https://opengameart.org/sites/default/files/kenney%5Fgraveyard-kit%5F5.0.zip"],"img":"https://opengameart.org/sites/default/files/preview_1352.png","tags":"3d,lowpoly,graveyard,halloween"},
           {"name":"City Kit (Commercial)","slug":"city-kit-commercial","author":"Kenney","page":"https://opengameart.org/content/city-kit-commercial","files":["https://opengameart.org/sites/default/files/kenney%5Fcity-kit-commercial%5F2.1.zip"],"img":"https://opengameart.org/sites/default/files/preview_1327.png","tags":"3d,lowpoly,city,building"},
          ]
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"vooy-asset-bot/1.0"})
              return urllib.request.urlopen(r,timeout=180).read()
          cat=get("https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv").decode("utf-8")
          names={row[0].strip().lower() for row in csv.reader(io.StringIO(cat)) if row}
          lic=get("https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt").decode("utf-8")
          subprocess.run(["git","config","user.name","sigco3111"],check=True)
          subprocess.run(["git","config","user.email","101856311+sigco3111@users.noreply.github.com"],check=True)
          cnt=0
          for c in C:
              slug=c["slug"]
              if cnt>=2: break
              if os.path.isdir(slug) or c["name"].lower() in names:
                  print("SKIP",c["name"]); continue
              os.makedirs(slug)
              files=[]
              if "scrape" in c:
                  page=get("https://opengameart.org/content/"+c["scrape"]).decode("utf-8","replace")
                  links=sorted(set(re.findall(r"/sites/default/files/[A-Za-z0-9%_.\-]+\.(?:obj|blend|fbx|mtl)",page)))
                  for l in links:
                      fn=urllib.parse.unquote(l.split("/")[-1])
                      open(os.path.join(slug,fn),"wb").write(get("https://opengameart.org"+l))
                      files.append(fn)
              else:
                  for u in c["files"]:
                      fn=urllib.parse.unquote(u.split("/")[-1])
                      open(os.path.join(slug,fn),"wb").write(get(u))
                      files.append(fn)
              zname=slug+".zip"
              if len(files)==1 and files[0].endswith(".zip"):
                  os.rename(os.path.join(slug,files[0]),os.path.join(slug,zname))
              else:
                  with zipfile.ZipFile(os.path.join(slug,zname),"w",zipfile.ZIP_DEFLATED) as z:
                      for fn in files: z.write(os.path.join(slug,fn),fn)
                  for fn in files: os.remove(os.path.join(slug,fn))
              size=os.path.getsize(os.path.join(slug,zname))
              rel=""
              if size>5*1024*1024:
                  tag="a105-"+slug
                  subprocess.run(["gh","release","create",tag,"-t",tag,"-n",c["name"]],check=True)
                  subprocess.run(["gh","release","upload",tag,os.path.join(slug,zname)],check=True)
                  os.remove(os.path.join(slug,zname))
                  rel="https://github.com/sigco3111/assets-3d-lowpoly-2/releases/download/"+tag+"/"+zname
              md="# "+c["name"]+"\n\n- 출처 URL: "+c["page"]+"\n- 받은 파일 수: "+str(len(files))+"\n- 라이선스: CC0\n- 제작자: "+c["author"]+"\n- zip 크기(바이트): "+str(size)+"\n- 태그: "+c["tags"]+"\n- AI 생성 여부: 출처 페이지에 언급 없음\n"
              open(os.path.join(slug,"pack.md"),"w").write(md)
              open(os.path.join(slug,"LICENSE-SOURCE.txt"),"w").write(c["name"]+"\n\n출처 URL: "+c["page"]+"\n표기 라이선스: CC0\n제작자: "+c["author"]+"\n")
              open(os.path.join(slug,"CREDITS.txt"),"w").write(c["name"]+" - "+c["author"]+"\n라이선스: CC0\n출처: "+c["page"]+"\n")
              open(os.path.join(slug,"LICENSE-CC0.txt"),"w").write(lic)
              open("/tmp/srcimg","wb").write(get(c["img"]))
              subprocess.run(["convert","/tmp/srcimg[0]","-resize","800x800>",os.path.join(slug,"preview.png")],check=True)
              subprocess.run(["git","add","-A"],check=True)
              subprocess.run(["git","commit","-m","에셋: "+c["name"]+" 추가"],check=True)
              subprocess.run(["git","push"],check=True)
              cnt+=1
              print("MANIFEST|"+c["name"]+"|"+slug+"|"+(rel if rel else slug+"/"+zname)+"|"+str(size))
          print("DONE")
          PY
          cat /tmp/l.txt
