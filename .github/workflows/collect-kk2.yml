name: collect-kk2
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-kk2.yml]
jobs:
  kk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: list uncollected kaykit repos
        run: |
          python3 - <<'PY'
          import csv, io, re, time, json, urllib.request, sys, traceback
          UA={'User-Agent':'asset-collector','Accept':'application/vnd.github+json'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60).read().decode('utf-8','replace')
          try:
              cat = list(csv.DictReader(io.StringIO(get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv?t=%d' % int(time.time())), newline='')))
              srcs = set(r['source_url'].strip().rstrip('/').lower() for r in cat)
              names = set(r['name'].strip().lower() for r in cat)
              repos = json.loads(get('https://api.github.com/orgs/KayKit-Game-Assets/repos?per_page=100&type=public'))
              print('::notice::KK2 org_repos=%d' % len(repos))
              cands = []
              for rp in repos:
                  url = rp['html_url'].lower()
                  if url in srcs or rp['name'].lower() in names: continue
                  cands.append(rp)
              print('::notice::KK2 uncollected=%d' % len(cands))
              for rp in cands[:8]:
                  try:
                      lic = get('https://raw.githubusercontent.com/KayKit-Game-Assets/%s/main/LICENSE' % rp['name'])
                  except Exception as e:
                      lic = 'ERR ' + str(e)[:60]
                  mark = 'CC0' if 'CC0' in lic else ('CC-BY' if 'Attribution' in lic else 'other')
                  print('::notice::KK2 cand %s | lic=%s | size_kb=%s | %s' % (rp['name'], mark, rp.get('size'), rp['html_url']))
          except BaseException as e:
              print('::error::KK2 ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace(chr(10),' '))
              traceback.print_exc()
              sys.exit(1)
          PY
