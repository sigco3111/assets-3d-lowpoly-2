name: collect-ac3
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-ac3.yml]
env:
  SOURCE: ambientcg
  MAX_PACKS: '1'
  DRY_RUN: 'false'
jobs:
  ac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: collect one ambientcg pack
        run: |
          python3 - <<'PY'
          import json, urllib.request, csv, io, time, os, zipfile, sys, traceback
          UA={'User-Agent':'asset-collector'}
          def get(u, limit=None):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120)
              ct = r.headers.get('Content-Type', '')
              data = r.read(limit) if limit else r.read()
              return ct, data
          try:
              _, cb = get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv?t=%d' % int(time.time()))
              cat = list(csv.DictReader(io.StringIO(cb.decode('utf-8'), newline='')))
              names = set(r['name'].strip().lower() for r in cat)
              srcs = set((r.get('source_url') or '').strip().rstrip('/').lower() for r in cat)
              print('::notice::AC1 catalog_rows=%d' % len(cat))
              _, jb = get('https://ambientcg.com/api/v2/full_json?type=Material&sort=Popular&limit=40')
              found = json.loads(jb.decode('utf-8')).get('foundAssets', [])
              print('::notice::AC1 api_materials=%d' % len(found))
              chosen = None
              for a in found:
                  aid = a.get('assetId', '')
                  nm = (a.get('displayName') or aid).strip()
                  page = 'https://ambientcg.com/a/' + aid
                  if nm.lower() in names or page.lower() in srcs:
                      print('::notice::AC1 skip dup %s' % aid); continue
                  chosen = (aid, nm, page); break
              if chosen is None:
                  raise SystemExit('::error::AC1 no candidate')
              aid, nm, page = chosen
              print('::notice::AC1 CHOSEN %s (%s) %s' % (aid, nm, page))
              _, pb = get('https://ambientcg.com/view?id=' + aid)
              print('::notice::AC1 page_has_CC0=%s bytes=%d' % (b'CC0' in pb, len(pb)))
              ct, zb = get('https://ambientcg.com/get?file=%s_1K-JPG.zip' % aid, limit=25*1024*1024 + 1)
              print('::notice::AC1 zip_probe ct=%s bytes=%d' % (ct, len(zb)))
              if len(zb) > 25*1024*1024:
                  raise SystemExit('::error::AC1 zip over 25MB, stopped')
              if zb[:2] != b'PK':
                  raise SystemExit('::error::AC1 not a zip (ct=%s)' % ct)
              slug = 'ambientcg-' + aid.lower()
              os.makedirs(slug, exist_ok=True)
              open(slug + '/' + slug + '.zip', 'wb').write(zb)
              zf = zipfile.ZipFile(slug + '/' + slug + '.zip')
              nl = zf.namelist()
              col = [n for n in nl if n.lower().endswith('color.jpg')]
              if col: open(slug + '/preview.jpg', 'wb').write(zf.read(col[0]))
              open(slug + '/LICENSE-SOURCE.txt', 'w', encoding='utf-8').write('AmbientCG asset page: ' + page + '\nPage license mark: CC0\nDownload: https://ambientcg.com/get?file=' + aid + '_1K-JPG.zip\n')
              open(slug + '/LICENSE.txt', 'w', encoding='utf-8').write('CC0 1.0 Universal (ambientCG page mark CC0)\nSource: ' + page + '\n')
              open(slug + '/pack.md', 'w', encoding='utf-8').write('# ' + nm + '\n\n- source: ' + page + '\n- license: CC0 (page mark)\n- zip: ' + slug + '.zip (1K-JPG, %d bytes, %d files)\n' % (len(zb), len(nl)))
              print('::notice::AC1 PACK slug=%s zip_bytes=%d files=%d preview=%s' % (slug, len(zb), len(nl), 'yes' if col else 'no'))
          except SystemExit as e:
              print(str(e)); sys.exit(1)
          except BaseException as e:
              print('::error::AC1 ' + (type(e).__name__ + ': ' + str(e))[:300].replace(chr(10), ' '))
              traceback.print_exc()
              sys.exit(1)
          PY
      - name: commit pack
        if: success()
        run: |
          SLUG=$(ls -d ambientcg-* 2>/dev/null | head -1)
          if [ -z "$SLUG" ]; then echo '::error::AC1 no slug'; exit 1; fi
          git config user.name asset-collector
          git config user.email asset-collector@users.noreply.github.com
          git add "$SLUG"
          git commit -m "에셋: $SLUG 추가 (ambientCG 1팩 시험)"
          ok=0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done
          if [ $ok = 1 ]; then echo "::notice::AC1 PUSH OK sha=$(git rev-parse --short HEAD) slug=$SLUG"; else echo '::error::AC1 PUSH FAILED'; exit 1; fi
