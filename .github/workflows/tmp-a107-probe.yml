name: tmp-a107-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: OGA probe
        run: |
          set +e
          UA="vooy-asset-bot/1.0"
          LIST="https://opengameart.org/art-search-advanced?keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=created&sort_order=DESC"
          echo "== LIST"
          curl -sS -L -A "$UA" -o /tmp/list.html -w "HTTP %{http_code} url=%{url_effective} type=%{content_type} bytes=%{size_download}\n" "$LIST"
          echo "curl rc=$?"
          python3 - <<'PY'
          import re, html
          s = open('/tmp/list.html','rb').read().decode('utf-8','replace')
          t = re.search(r'<title[^>]*>(.*?)</title>', s, re.S|re.I)
          print('PAGE TITLE:', html.unescape(t.group(1)).strip() if t else None)
          print('BYTES:', len(s))
          low = s.lower()
          for k in ['just a moment','challenge','captcha','access denied','cloudflare','log in','403','404']:
              print('MARK', k, low.count(k))
          slugs = []
          for m in re.finditer(r'href="/content/([^"#?/]+)"', s):
              if m.group(1) not in slugs:
                  slugs.append(m.group(1))
          print('CONTENT LINKS:', len(slugs))
          for i, x in enumerate(slugs[:10], 1):
              print('SLUG', i, x)
          open('/tmp/first','w').write(slugs[0] if slugs else 'none')
          PY
          SLUG=$(cat /tmp/first)
          echo "== PACK $SLUG"
          curl -sS -L -A "$UA" -o /tmp/pack.html -w "HTTP %{http_code} url=%{url_effective} bytes=%{size_download}\n" "https://opengameart.org/content/$SLUG"
          echo "curl rc=$?"
          python3 - <<'PY'
          import re, html
          s = open('/tmp/pack.html','rb').read().decode('utf-8','replace')
          t = re.search(r'<title[^>]*>(.*?)</title>', s, re.S|re.I)
          print('PACK TITLE:', html.unescape(t.group(1)).strip() if t else None)
          txt = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', s)))
          i = txt.find('License')
          print('LICENSE CONTEXT:', txt[max(0,i-50):i+250] if i >= 0 else 'NO License TEXT')
          for m in re.finditer(r'href="([^"]+)"', s):
              h = m.group(1)
              if '/sites/default/files/' in h or re.search(r'\.(zip|7z|rar|tar\.gz)(\?|$)', h, re.I):
                  print('FILE HREF:', h)
          PY
          echo "== END"
