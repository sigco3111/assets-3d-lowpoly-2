{"name":"tmp-up-probe5","on":{"workflow_dispatch":{}},"jobs":{"probe":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"run":"set +e; S=$GITHUB_STEP_SUMMARY; UA='Mozilla/5.0'; echo '## KENNEY_DL' >> $S; DL=$(grep -oE 'https?://kenney.nl/download-link[^\" <>]*' /tmp/k.html | head -1); echo dl_link $DL >> $S; curl -sIL -A \"$UA\" \"$DL\" | grep -iE '^(HTTP|location|content-length|content-type)' | tail -4 >> $S; curl -sL -A \"$UA\" \"$DL\" -o /tmp/dl.html; echo dl_page $(wc -c < /tmp/dl.html) >> $S; grep -oE 'https[^\" <>]*[.]zip' /tmp/dl.html | sort -u | head -3 >> $S; echo '## QUAT_QAL' >> $S; curl -sL -A \"$UA\" https://quaternius.com/license.html -o /tmp/q.html; sed 's/<[^>]*>/ /g' /tmp/q.html | tr -s ' ' | grep -oiE '.{0,250}(redistribut|commercial|credit|sell|free to|license is|may not|allowed).{0,250}' | head -4 | cut -c1-520 >> $S; echo '## QUAT_PACKS' >> $S; curl -sL -A \"$UA\" https://quaternius.com/ -o /tmp/q2.html; grep -oE 'href=\"[^\"]*\"' /tmp/q2.html | sort -u | head -15 >> $S; echo '## POLYHAVEN_FILE' >> $S; curl -sL 'https://api.polyhaven.com/assets?t=models' -o /tmp/phm.json; SL=$(grep -oE '\"[a-z0-9_]+\":\\{\"name\"' /tmp/phm.json | head -1 | sed 's/^\"//; s/\".*//'); echo slug $SL >> $S; curl -sL https://api.polyhaven.com/files/$SL -o /tmp/phf.json; echo phf_bytes $(wc -c < /tmp/phf.json) gltf_count $(grep -oE '\"gltf\"' /tmp/phf.json | wc -l) >> $S; echo '## AMBIENTCG_API' >> $S; curl -sL -A \"$UA\" 'https://ambientcg.com/api/v2/full_json?type=Material&limit=3' -o /tmp/aj.json; echo amb_bytes $(wc -c < /tmp/aj.json) >> $S; grep -oE '\"assetId\": *\"[^\"]*\"' /tmp/aj.json | head -3 >> $S; echo '## KAYKIT_USER' >> $S; curl -sL -A \"$UA\" 'https://api.github.com/users/KayKit-Game-Assets/repos?per_page=100' -o /tmp/ko.json; echo kaykit_repos $(grep -c '\"full_name\"' /tmp/ko.json) >> $S; grep -oE '\"name\": \"[^\"]*\"' /tmp/ko.json | sed 's/\"name\": //' | tr -d '\"' | tr '\\n' ' ' >> $S; echo >> $S; echo done5 >> $S"}]}}}
