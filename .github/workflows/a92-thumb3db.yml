name: a92-thumb3db
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: thumb
        run: |
          set -uo pipefail
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          if ! command -v convert >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y -qq imagemagick; fi
          mkdir -p previews
          cat > /tmp/list.tsv <<'EOF'
          rts-medieval-props|RTS medieval props|https://opengameart.org/content/rts-medieval-props
          food-pack-cooking|Food Pack: Cooking|https://opengameart.org/content/food-pack-cooking
          EOF
          while IFS='|' read -u 3 -r SLUG NAME PAGE; do
            echo "== $NAME"
            curl -sSL -m 60 "$PAGE" -o /tmp/page.html || { echo SKIP page; continue; }
            OG=$(grep -o 'https://opengameart.org/sites/default/files/[^" ]*' /tmp/page.html | grep -Ei '[.](png|jpg|jpeg)$' | head -1)
            echo "og=$OG"
            if [ -z "$OG" ]; then echo "NOOG $NAME"; continue; fi
            curl -sSL -m 60 "$OG" -o /tmp/thumb.img || { echo SKIP dl; continue; }
            if [ ! -s /tmp/thumb.img ]; then echo "EMPTY $NAME"; continue; fi
            convert /tmp/thumb.img -resize '480x480>' -strip "previews/$SLUG.png" < /dev/null 2>/dev/null || true
            if [ ! -s "previews/$SLUG.png" ]; then echo "CONVERT FAIL $NAME"; continue; fi
            if [ "$(stat -c%s "previews/$SLUG.png")" -gt 204800 ]; then
              convert /tmp/thumb.img -resize '480x480>' -strip -quality 85 "previews/$SLUG.jpg" < /dev/null 2>/dev/null || true
              [ -s "previews/$SLUG.jpg" ] && rm -f "previews/$SLUG.png"
            fi
            git add previews; git commit -q -m "썸네일: $NAME 추가" < /dev/null; echo "THUMB OK $NAME"
          done 3< /tmp/list.tsv
          git push origin HEAD:main
          ls previews | tail -5
