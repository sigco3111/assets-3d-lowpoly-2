{"name":"auto-collect","on":{"schedule":[{"cron":"10 * * * *"}],"workflow_dispatch":{"inputs":{"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":true},"max_packs":{"description":"packs per run (default 2)","required":false,"type":"string","default":"2"}}}},"concurrency":{"group":"auto-collect","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"kill-switch check","id":"ks","run":"test -f triggers/auto-collect-stop.txt && echo 'STOP: kill-switch on' >> $GITHUB_STEP_SUMMARY || true"},{"name":"install pillow","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"pip install -q pillow"},{"name":"collect","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","env":{"DRY":"${{ inputs.dry_run || 'false' }}","MAXP":"${{ inputs.max_packs || '2' }}","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 - <<'PY'\nimport os, io, re, csv, json, time, zipfile, subprocess, urllib.request, datetime, sys, html, shutil, traceback\nMAXP = int(os.environ.get('MAXP') or '2')\nDRY = (os.environ.get('DRY') or 'false').lower() == 'true'\nREPO = 'sigco3111/assets-3d-lowpoly-2'\nTOKEN = os.environ.get('GH_TOKEN') or ''\nUA = {'User-Agent': 'Mozilla/5.0 asset-collector'}\nTODAY = datetime.date.today().isoformat()\nSUM = []\ndef log(s):\n    print(s); SUM.append(s)\ndef finish(code=0):\n    sp = os.environ.get('GITHUB_STEP_SUMMARY')\n    if sp:\n        with open(sp, 'a', encoding='utf-8') as f: f.write('\\n'.join(SUM) + '\\n')\n    sys.exit(code)\ndef get(url, t=120, lim=None):\n    with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=t) as r:\n        if lim:\n            cl = r.headers.get('Content-Length')\n            if cl and int(cl) > lim: raise Exception('size>%d' % lim)\n            d = r.read(lim + 1)\n            if len(d) > lim: raise Exception('size>%d' % lim)\n            return d\n        return r.read()\ndef gt(url): return get(url).decode('utf-8', 'replace')\ndef run(a): return subprocess.run(a, check=True, capture_output=True, text=True).stdout\ndef clean(s): return re.sub(r'\\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', s))).strip()\ndef W(p, s):\n    with open(p, 'w', encoding='utf-8') as f: f.write(s)\ndef classify(lic):\n    u = lic.upper()\n    if re.search(r'-NC\\b|NON.?COMMERCIAL|-ND\\b|NO.?DERIV|-SA\\b|SHARE.?ALIKE', u): return None\n    if re.search(r'CC0|CC 0|PUBLIC DOMAIN DEDICATION', u): return 'CC0'\n    if re.search(r'CC[ -]?BY[ -]?4\\.0', u): return 'CC-BY 4.0'\n    if re.search(r'CC[ -]?BY[ -]?3\\.0', u): return 'CC-BY 3.0'\n    if re.search(r'OGA[ -]?BY[ -]?4\\.0', u): return 'OGA-BY 4.0'\n    if re.search(r'OGA[ -]?BY[ -]?3\\.0', u): return 'OGA-BY 3.0'\n    if re.search(r'\\bMIT\\b', u): return 'MIT'\n    if re.search(r'GPL[ -]?(V ?)?3', u): return 'GPL 3.0'\n    if re.search(r'GPL[ -]?(V ?)?2', u): return 'GPL 2.0'\n    return None\nLEG = {'CC0': 'https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt', 'CC-BY 3.0': 'https://creativecommons.org/licenses/by/3.0/legalcode.txt', 'CC-BY 4.0': 'https://creativecommons.org/licenses/by/4.0/legalcode.txt', 'GPL 2.0': 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt', 'GPL 3.0': 'https://www.gnu.org/licenses/gpl-3.0.txt'}\ndef parse(path):\n    url = 'https://opengameart.org' + path\n    h = gt(url)\n    t = re.search(r'<h1[^>]*>(.*?)</h1>', h, re.S)\n    title = clean(t.group(1)) if t else ''\n    m = re.search(r'License\\(s\\)', h)\n    seg = h[m.end():m.end() + 700] if m else ''\n    cut = re.search(r'Attachments|Submitted|Tags|Art Type|Comments', seg)\n    if cut: seg = seg[:cut.start()]\n    lic_raw = clean(seg)[:120]\n    au = re.search(r'Submitted by.{0,300}?<a[^>]*>(.*?)</a>', h, re.S)\n    atts = []\n    for u in re.findall(r'href=\"([^\"]+)\"', h):\n        uu = html.unescape(u)\n        if re.search(r'/sites/default/files/[^\"]*\\.(zip|7z|rar|tar\\.gz|blend|obj|fbx|glb|gltf|dae)$', uu, re.I):\n            if uu.startswith('/'): uu = 'https://opengameart.org' + uu\n            if uu not in atts: atts.append(uu)\n    atts.sort(key=lambda x: 0 if re.search(r'\\.zip$', x, re.I) else 1)\n    og = re.search(r'<meta property=\"og:image\" content=\"([^\"]+)\"', h)\n    return dict(path=path, url=url, title=title, lic_raw=lic_raw, lic=classify(lic_raw) or '', author=clean(au.group(1)) if au else '', atts=atts, img=html.unescape(og.group(1)) if og else '')\ndef build(slug, p):\n    folder = slug\n    att = p['atts'][0]\n    name = att.split('/')[-1].split('?')[0]\n    data = get(att, lim=25 * 1024 * 1024)\n    if name.lower().endswith('.zip'):\n        zbytes = data\n        names = zipfile.ZipFile(io.BytesIO(data)).namelist()\n    elif re.search(r'\\.(blend|obj|fbx|glb|gltf|dae)$', name, re.I):\n        b = io.BytesIO()\n        with zipfile.ZipFile(b, 'w', zipfile.ZIP_DEFLATED) as z: z.writestr(name, data)\n        zbytes = b.getvalue(); names = [name]\n    else:\n        raise Exception('zip 아님: ' + name)\n    if not any(re.search(r'\\.(blend|obj|fbx|glb|gltf|dae)$', n, re.I) for n in names):\n        raise Exception('3D 파일 없음')\n    if len(zbytes) > 25 * 1024 * 1024: raise Exception('25MB 초과')\n    zname = slug + '.zip'\n    os.makedirs(folder, exist_ok=True)\n    if len(zbytes) > 5 * 1024 * 1024:\n        tag = 'pack-' + slug\n        W('/tmp/' + zname, '') if False else None\n        with open('/tmp/' + zname, 'wb') as f: f.write(zbytes)\n        run(['gh', 'release', 'create', tag, '/tmp/' + zname, '--repo', REPO, '--title', p['title'], '--notes', 'Asset pack zip (5MB 초과, Releases 보관)'])\n        where = 'https://github.com/%s/releases/download/%s/%s' % (REPO, tag, zname)\n        filecol = 'release:' + tag + '/' + zname\n    else:\n        with open(os.path.join(folder, zname), 'wb') as f: f.write(zbytes)\n        where = '저장소 트리 ' + folder + '/' + zname\n        filecol = folder + '/' + zname\n    from PIL import Image\n    im = Image.open(io.BytesIO(get(p['img'], lim=10 * 1024 * 1024))).convert('RGBA')\n    out = b''\n    for sz in (960, 720, 512):\n        t = im.copy(); t.thumbnail((sz, sz))\n        b = io.BytesIO(); t.save(b, 'PNG', optimize=True); out = b.getvalue()\n        if len(out) <= 1024 * 1024: break\n    if len(out) > 1024 * 1024: raise Exception('preview 1MB 초과')\n    with open(os.path.join(folder, 'preview.png'), 'wb') as f: f.write(out)\n    lt = LEG.get(p['lic'])\n    if lt:\n        try: body = gt(lt)\n        except Exception as e: body = '(전문 가져오기 실패: %s) %s' % (str(e)[:80], lt)\n    else:\n        body = '(전문 링크 없음. 원문은 출처 페이지 %s 참조)' % p['url']\n    W(os.path.join(folder, 'LICENSE.txt'), p['lic'] + ' 전문\\n' + body)\n    W(os.path.join(folder, 'LICENSE-SOURCE.txt'), 'Source: %s\\nLicense: %s\\nChecked: %s (GitHub Actions runner)\\nQuote: %s\\n' % (p['url'], p['lic'], TODAY, p['lic_raw']))\n    attr = '필수: %s (opengameart.org), %s' % (p['author'], p['lic'])\n    W(os.path.join(folder, 'CREDITS.txt'), '%s\\n제작자: %s\\n출처: %s\\n라이선스: %s\\n표기: %s\\n' % (p['title'], p['author'], p['url'], p['lic'], attr))\n    W(os.path.join(folder, 'pack.md'), '# %s\\n\\n- 라이선스: %s\\n- 출처: %s\\n- 제작자: %s\\n- 수집일: %s (auto-collect, 자동)\\n- 파일: %s\\n- 저장: %s\\n- AI 생성: 확인 안 함 (출처 페이지에 명시 없음)\\n' % (p['title'], p['lic'], p['url'], p['author'], TODAY, zname, where))\n    meta = dict(name=p['title'], slug=slug, zip=zname, file=filecol, author=p['author'], url=p['url'], license=p['lic'], attr=attr, date=TODAY, tags='3d,opengameart', notes='출처 페이지 License(s) %s 확인 (자동 수집, 원문: %s); CREDITS.txt 표기' % (p['lic'], p['lic_raw'][:60]), preview='preview.png', kind='3D 모델')\n    W(os.path.join(folder, 'meta.json'), json.dumps(meta, ensure_ascii=False, indent=1))\n    return meta\ndef commit_push(meta):\n    run(['git', 'add', meta['slug']])\n    run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-q', '-m', '에셋: %s 추가' % meta['name']])\n    for k in range(3):\n        try:\n            run(['git', 'pull', '--rebase', '-q', 'origin', 'main']); run(['git', 'push', '-q', 'origin', 'HEAD:main']); break\n        except subprocess.CalledProcessError:\n            time.sleep(5)\n    else:\n        raise Exception('push failed')\n    return run(['git', 'rev-parse', '--short', 'HEAD']).strip()\ntry:\n    cat = gt('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv?t=%d' % int(time.time()))\n    rows = list(csv.DictReader(io.StringIO(cat, newline='')))\n    SRC = [(r.get('source_url') or '').strip().rstrip('/').lower() for r in rows]\n    NAMES = {(r.get('name') or '').strip().lower() for r in rows}\n    log('CATALOG rows=%d dry_run=%s max_packs=%d' % (len(rows), DRY, MAXP))\n    rq = urllib.request.Request('https://api.github.com/repos/' + REPO, headers={'User-Agent': 'asset-collector', 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json'})\n    size_mb = json.loads(urllib.request.urlopen(rq, timeout=60).read())['size'] / 1024.0\n    log('REPO size=%.1fMB' % size_mb)\n    if size_mb > 700:\n        log('WARN 저장소 700MB 부근 - 수집 중단'); finish(0)\n    paths = []\n    for sort in ['created', 'count']:\n        for pg in range(6):\n            h = gt('https://opengameart.org/art-search-advanced?keys=&field_art_type_tid%5B%5D=10&sort_by=' + sort + '&sort_order=DESC&page=' + str(pg))\n            for p in re.findall(r'href=\"(/content/[A-Za-z0-9_\\-]+)\"', h):\n                if p not in paths: paths.append(p)\n    log('LISTED candidates=%d' % len(paths))\n    if len(paths) == 0:\n        log('ERROR OGA 목록 0건 (challenge 가능성)'); finish(1)\n    added = []; picks = []; seen = 0\n    for path in paths:\n        if len(added) >= MAXP or len(picks) >= MAXP or seen >= 150: break\n        seen += 1\n        slug = path.split('/')[-1].lower()\n        url = 'https://opengameart.org' + path\n        if url.lower() in SRC or any(s.endswith('/content/' + slug) for s in SRC):\n            log('SKIP dup %s' % path); continue\n        if os.path.exists(slug):\n            log('SKIP folder-exists %s' % slug); continue\n        try:\n            p = parse(path)\n        except Exception as e:\n            log('SKIP fetch %s: %s' % (path, str(e)[:80])); continue\n        if not p['lic']:\n            log('SKIP license %s [%s]' % (path, p['lic_raw'][:60])); continue\n        if p['title'].lower() in NAMES:\n            log('SKIP dup-name %s' % p['title']); continue\n        if not p['author']:\n            log('SKIP author-parse %s' % path); continue\n        if not p['atts']:\n            log('SKIP no-attachment %s' % path); continue\n        if not p['img']:\n            log('SKIP no-preview %s' % path); continue\n        if DRY:\n            log('CANDIDATE %s | %s | %s | %s | %s' % (slug, p['title'], p['lic'], p['author'], p['atts'][0].split('/')[-1])); picks.append(slug); continue\n        try:\n            meta = build(slug, p)\n            sha = commit_push(meta)\n            added.append(meta)\n            log('ADDED %s | %s | %s | %s | %s | commit %s' % (meta['slug'], meta['name'], meta['license'], meta['url'], meta['file'], sha))\n        except Exception as e:\n            log('SKIP build %s: %s' % (slug, str(e)[:160]))\n            shutil.rmtree(slug, ignore_errors=True)\n    if DRY:\n        log('DRY summary picks=%d scanned=%d' % (len(picks), seen))\n    elif not added:\n        log('NO-NEW-PACKS scanned=%d' % seen)\n    finish(0)\nexcept SystemExit:\n    raise\nexcept Exception as e:\n    log('ERROR %s: %s' % (type(e).__name__, str(e)[:300])); traceback.print_exc(); finish(1)\nPY\n"}]}}}
