name: tmp-a107-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: OGA probe 3
        run: |
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse
          UA = 'vooy-asset-bot/1.0'
          def get(u, method='GET'):
              r = urllib.request.Request(u, headers={'User-Agent': UA}, method=method)
              with urllib.request.urlopen(r, timeout=90) as resp:
                  body = b'' if method == 'HEAD' else resp.read()
                  return resp.status, resp.geturl(), dict(resp.headers), body.decode('utf-8', 'replace')
          LIST = 'https://opengameart.org/art-search-advanced?keys=&field_art_type_tid[]=10&field_art_licenses_tid[]=4&sort_by=created&sort_order=DESC'
          st, url, hd, s = get(LIST)
          print('LIST HTTP', st, url, hd.get('Content-Type'), len(s))
          slugs = []
          for m in re.finditer(r'href="/content/([^"#?/]+)"', s):
              if m.group(1) not in slugs and m.group(1) != 'faq':
                  slugs.append(m.group(1))
          print('SLUGS', slugs[:10])
          found = 0
          for slug in slugs[:12]:
              try:
                  st, u, hd, p = get('https://opengameart.org/content/' + slug)
              except Exception as e:
                  print('PACK ERR', slug, e); continue
              t = re.search(r'<title[^>]*>(.*?)</title>', p, re.S | re.I)
              txt = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', p)))
              i = txt.find('License(s)')
              if i < 0: i = txt.find('License')
              print('PACK', slug, st, html.unescape(t.group(1)).strip() if t else None)
              print('  LIC:', txt[i:i+200] if i >= 0 else 'NONE')
              hrefs = []
              for h in re.findall(r'href="([^"]+)"', p):
                  if ('/sites/default/files/' in h) and re.search(r'\.(zip|7z|rar|tar\.gz|obj|blend|fbx|png|ogg|wav|mp3)(\?|$)', h, re.I):
                      if h not in hrefs: hrefs.append(h)
              for h in hrefs[:6]:
                  full = urllib.parse.urljoin(u, h)
                  try:
                      _, _, hh, _ = get(full, 'HEAD')
                      print('  FILE', full, 'len=', hh.get('Content-Length'))
                  except Exception as e:
                      print('  FILE ERR', full, e)
              if hrefs:
                  found += 1
              if found >= 2:
                  break
          print('DONE')

          PY
