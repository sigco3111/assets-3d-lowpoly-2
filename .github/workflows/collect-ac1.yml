name: collect-ac1
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-ac1.yml]
env:
  SOURCE: ambientcg
  MAX_PACKS: '1'
  DRY_RUN: 'false'
jobs:
  ac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: collect one ambientcg pack
        run: |
          python3 - <<'PY'
          import json, urllib.request, csv, io, time, os, zipfile, sys, traceback
          UA={'User-Agent':'asset-collector'}
          def get(u, limit=None):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120)
              ct = r.headers.get('Content-Type', '')
              data = r.read(limit) if limit else r.read()
              return ct, data
          try:
              _, cb = get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv?t=%d' % int(time.time()))
              cat = list(csv.DictReader(io.StringIO(cb.decode('utf-8'), newline='')))
              names = set(r['name'].strip().lower() for r in cat)
              srcs = set((r.get('source_url') or '').strip().rstrip('/').lower() for r in cat)
              print('::notice::AC1 catalog_rows=%d' % len(cat))
              _, jb = get('https://ambientcg.com/api/v2/full_json?type=Material&sort=Popular&limit=40')
              found = json.loads(jb.decode('utf-8')).get('foundAssets', [])
              print('::notice::AC1 api_materials=%d' % len(found))
              done = False
              tried = 0
              for a in found:
                  aid = a.get('assetId', '')
                  nm = (a.get('displayName') or aid).strip()
                  page = 'https://ambientcg.com/a/' + aid
                  if nm.lower() in names or page.lower() in srcs or any(aid.lower() == s.rstrip('/').split('/')[-1] for s in srcs):
                      print('::notice::AC1 skip dup %s (%s)' % (aid, nm)); continue
                  if tried >= 5: break
                  tried += 1
                  _, pb = get('https://ambientcg.com/view?id=' + aid)
                  if b'CC0' not in pb:
                      print('::notice::AC1 skip no CC0 on page %s' % aid); continue
                  ct, zb = get('https://ambientcg.com/get?file=%s_1K-JPG.zip' % aid, limit=5*1024*1024 + 1)
                  if len(zb) > 5*1024*1024:
                      print('::notice::AC1 skip over5MB %s' % aid); continue
                  if zb[:2] != b'PK':
                      print('::notice::AC1 skip not zip %s ct=%s' % (aid, ct)); continue
                  slug = 'ambientcg-' + aid.lower()
                  os.makedirs(slug, exist_ok=True)
                  open(slug + '/' + slug + '.zip', 'wb').write(zb)
                  zf = zipfile.ZipFile(slug + '/' + slug + '.zip')
                  names_in = zf.namelist()
                  col = [n for n in names_in if n.lower().endswith('color.jpg')]
                  if col:
                      open(slug + '/preview.jpg', 'wb').write(zf.read(col[0]))
                  lf = open(slug + '/LICENSE-SOURCE.txt', 'w', encoding='utf-8')
                  print('AmbientCG asset page: ' + page, file=lf)
                  print('Page license mark: CC0 (checked in page HTML)', file=lf)
                  print('Download: https://ambientcg.com/get?file=%s_1K-JPG.zip' % aid, file=lf)
                  lf.close()
                  lc = open(slug + '/LICENSE.txt', 'w', encoding='utf-8')
                  print('CC0 1.0 Universal (ambientCG page mark CC0)', file=lc)
                  print('Source: ' + page, file=lc)
                  lc.close()
                  pm = open(slug + '/pack.md', 'w', encoding='utf-8')
                  print('# ' + nm, file=pm)
                  print('', file=pm)
                  print('- source: ' + page, file=pm)
                  print('- license: CC0 (page mark)', file=pm)
                  print('- zip: ' + slug + '.zip (1K-JPG, %d bytes)' % len(zb), file=pm)
                  print('- files in zip: %d' % len(names_in), file=pm)
                  pm.close()
                  print('::notice::AC1 PACK slug=%s name=%s zip_bytes=%d files=%d preview=%s' % (slug, nm, len(zb), len(names_in), 'yes' if col else 'no'))
                  print('::notice::AC1 ids ' + aid + ' dataType=' + str(a.get('dataType')) + ' tags=' + str(a.get('tags', ''))[:90])
                  done = True
                  break
              if not done:
                  print('::error::AC1 no pack chosen (tried=%d)' % tried); sys.exit(1)
          except BaseException as e:
              print('::error::AC1 ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace(chr(10), ' '))
              traceback.print_exc()
              sys.exit(1)
          PY
      - name: commit pack
        run: |
          SLUG=$(ls -d ambientcg-* 2>/dev/null | head -1)
          if [ -z "$SLUG" ]; then echo '::error::AC1 no slug'; exit 1; fi
          git config user.name asset-collector
          git config user.email asset-collector@users.noreply.github.com
          git add "$SLUG"
          git commit -m "에셋: $SLUG 추가 (ambientCG 1팩 시험)"
          ok=0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done
          if [ $ok = 1 ]; then echo "::notice::AC1 PUSH OK sha=$(git rev-parse --short HEAD) slug=$SLUG"; else echo '::error::AC1 PUSH FAILED'; exit 1; fi
