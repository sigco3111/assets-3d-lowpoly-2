name: A88 ingest
on: push
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/a88.sh
      - name: README 갱신
        run: |
          printf '\n### Low Poly Stalls\n- 파일: lightdreamerlabs-3d-stalls.zip (703.1KB) — 저장소 내 포함\n- 제작: lightdreamerlabs / 라이선스: CC0 / 원본: https://opengameart.org/content/low-poly-stalls\n' >> README.md
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git add -A
          git commit -m "에셋: Low Poly Stalls 추가"
          git push
