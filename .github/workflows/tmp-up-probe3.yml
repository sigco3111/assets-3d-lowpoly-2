{"name":"tmp-up-probe3","on":{"workflow_dispatch":{}},"jobs":{"probe":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"run":"S=$GITHUB_STEP_SUMMARY; t(){ sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -oiE '.{0,200}(cc0|creative commons|public domain|licen[cs]e|redistribut|attribution).{0,200}' | head -3 | cut -c1-400; }; curl -sL -A 'Mozilla/5.0' https://kenney.nl/assets -o /tmp/ka.html; curl -sL -A 'Mozilla/5.0' https://kenney.nl/assets/platformer-kit -o /tmp/k.html; echo '## KENNEY' >> $S; grep -oE 'href=\"[^\"]*\"' /tmp/k.html | grep -iE 'download|zip|media|content|\\.7z' | sort -u | head -12 >> $S; echo kenney_list_slugs $(grep -oE 'href=\"/assets/[^\"/]*\"' /tmp/ka.html | sort -u | wc -l) >> $S; grep -oE 'href=\"/assets/[^\"/]*\"' /tmp/ka.html | sort -u | tr -d '\"' | sed 's#href=/assets/##' > /tmp/kslugs.txt; n=0; for s in $(cat /tmp/kslugs.txt); do grep -qi \"$s\" /tmp/cat.csv || n=$((n+1)); done; echo kenney_slugs_not_in_catalog $n >> $S; echo '## QUATERNIUS' >> $S; t < /tmp/q.html >> $S; grep -oE 'href=\"[^\"]*\"' /tmp/q2.html | grep -ciE 'pack|zip|download' >> $S; grep -oE 'href=\"[^\"]*\"' /tmp/q2.html | grep -iE 'pack|zip|download' | sort -u | head -8 >> $S; echo '## POLYHAVEN' >> $S; curl -sL https://api.polyhaven.com/assets?t=models -o /tmp/phm.json; echo phm_models $(grep -oE '\"[a-z0-9_]+\":\\{\"name\"' /tmp/phm.json | wc -l) >> $S; curl -sL https://api.polyhaven.com/assets?t=textures -o /tmp/pht.json; echo pht_textures $(grep -oE '\"[a-z0-9_]+\":\\{\"name\"' /tmp/pht.json | wc -l) >> $S; curl -sL https://api.polyhaven.com/files/armchair_01 -o /tmp/phf.json; echo phf_bytes $(wc -c < /tmp/phf.json) >> $S; grep -oE '\"gltf\"' /tmp/phf.json | head -1 >> $S; head -c 200 /tmp/phf.json >> $S; echo >> $S; echo '## AMBIENTCG' >> $S; curl -sL -A 'Mozilla/5.0' https://ambientcg.com/ -o /tmp/ah.html; grep -oiE '.{0,120}CC0.{0,120}' /tmp/ah.html | head -2 | cut -c1-300 >> $S; curl -sL https://ambientcg.com/api/v2/full_json?type=Material&limit=1 -o /tmp/aj.json; echo amb_json_bytes $(wc -c < /tmp/aj.json) >> $S; echo '## KAYKIT' >> $S; curl -sL https://api.github.com/orgs/KayKit-Game-Assets/repos?per_page=100 -o /tmp/ko.json; echo kaykit_repos $(grep -c '\"full_name\"' /tmp/ko.json) >> $S; for r in $(grep -oE '\"name\": \"[^\"]*\"' /tmp/ko.json | sed 's/\"name\": \"//;s/\"$//'); do grep -qi \"$r\" /tmp/cat.csv || echo \"notincat $r\" >> $S; done; echo '## QUAT_OGA' >> $S; echo done >> $S"}]}}}
