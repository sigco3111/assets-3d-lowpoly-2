name: reg-ac-probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/reg-ac-probe.yml]
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: probe catalog row format
        run: |
          python3 - <<'PY'
          import csv, io, time, urllib.request, sys, traceback, collections
          HDR = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes','preview','sample','split']
          try:
              cu = 'https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv?t=%d' % int(time.time())
              raw = urllib.request.urlopen(urllib.request.Request(cu, headers={'User-Agent':'asset-collector'}), timeout=120).read().decode('utf-8')
              rdr = csv.DictReader(io.StringIO(raw, newline=''))
              assert rdr.fieldnames == HDR, 'header mismatch %s' % rdr.fieldnames
              rows = list(rdr)
              n_before = len(rows)
              print('::notice::R header_ok n_before=%d' % n_before)
              same = [r for r in rows if r['repo'].strip() == 'assets-3d-lowpoly-2']
              cnt = collections.Counter(r['type'] for r in same)
              print('::notice::R same_repo=%d type_counts=%s' % (len(same), cnt.most_common(4)))
              print('::notice::R prev_row=' + repr({k: same[-1][k] for k in HDR}))
              dup = [r for r in rows if r['name'].strip().lower() == 'concrete 049' or 'ambientcg.com/a/concrete049' in (r.get('source_url') or '').lower()]
              print('::notice::R dup_hits=%d' % len(dup))
          except BaseException as e:
              print('::error::R ' + (type(e).__name__ + ': ' + str(e))[:300].replace(chr(10),' '))
              traceback.print_exc()
              sys.exit(1)
          PY
