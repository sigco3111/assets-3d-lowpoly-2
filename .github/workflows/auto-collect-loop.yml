{"name":"auto-collect-loop","on":{"schedule":[{"cron":"7,22,37,52 * * * *"}],"workflow_dispatch":{"inputs":{"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":true},"max_packs":{"description":"packs per round (default 8)","required":false,"type":"string","default":"8"}}}},"concurrency":{"group":"auto-collect","cancel-in-progress":false},"permissions":{"contents":"write","actions":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"name":"checkout","uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"name":"install pillow","run":"pip install -q pillow"},{"name":"auto-collect loop (auto-collect.yml steps, repeated)","env":{"DRY":"${{ inputs.dry_run || 'false' }}","MAXP":"${{ inputs.max_packs || '8' }}","ROUNDS":"6","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 - <<'PY'\nimport os, json, subprocess, sys, time\nt0 = time.time()\nROUNDS = int(os.environ.get('ROUNDS') or '6')\nMAXP = os.environ.get('MAXP') or '8'\nLIMIT = 20 * 60\nREPO = os.environ.get('GITHUB_REPOSITORY') or 'sigco3111/assets-3d-lowpoly-2'\nKILL = 'triggers/auto-collect-stop.txt'\ndef sh(c):\n    return subprocess.run(['bash', '-c', c], capture_output=True, text=True)\ndef head():\n    return sh('git rev-parse HEAD').stdout.strip()\ndef size_kb():\n    r = sh('gh api repos/' + REPO + ' --jq .size')\n    try:\n        return int(r.stdout.strip())\n    except Exception:\n        return -1\nd = json.load(open('.github/workflows/auto-collect.yml'))\nsteps = [s for s in d['jobs']['collect']['steps'] if 'run' in s]\nrounds_done = 0\nlast_new = 0\nstop_why = 'round limit'\nfor rnd in range(1, ROUNDS + 1):\n    if os.path.exists(KILL):\n        stop_why = 'kill-switch'\n        break\n    if time.time() - t0 > LIMIT:\n        stop_why = 'time budget'\n        break\n    sz = size_kb()\n    print('repo size KB', sz, flush=True)\n    if sz > 650000:\n        stop_why = 'repo size near 700MB'\n        break\n    sh('git pull --ff-only -q origin main')\n    before = head()\n    print('== round', rnd, 'start HEAD', before[:7], flush=True)\n    for st in steps:\n        print('== step:', st.get('name'), flush=True)\n        r = subprocess.run(['bash', '-c', st['run']])\n        if r.returncode != 0:\n            print('step failed rc', r.returncode, flush=True)\n            sys.exit(r.returncode)\n    after = head()\n    n = 0\n    if after != before:\n        n = int(sh('git rev-list --count ' + before + '..' + after).stdout.strip() or 0)\n    rounds_done = rnd\n    last_new = n\n    print('round', rnd, 'new commits', n, flush=True)\n    if n == 0:\n        stop_why = 'no new packs'\n        break\nprint('loop end:', stop_why, 'rounds', rounds_done, 'last new', last_new, flush=True)\nif last_new > 0 and stop_why == 'round limit' and not os.path.exists(KILL) and time.time() - t0 < LIMIT:\n    r = sh('gh workflow run auto-collect-loop.yml -F dry_run=false -f max_packs=' + MAXP)\n    print('self-dispatch rc', r.returncode, r.stdout.strip(), r.stderr.strip()[:300], flush=True)\nPY\n"}]}}}
