{"name":"tmp-up-probe","on":{"workflow_dispatch":{}},"jobs":{"probe":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"run":"UA='Mozilla/5.0'; for u in 'https://kenney.nl/assets' 'https://kenney.nl/support' 'https://github.com/KenneyNL' 'https://quaternius.com/' 'https://opengameart.org/users/quaternius' 'https://github.com/KayKit-Game-Assets' 'https://kaylousberg.itch.io/' 'https://poly.pizza/' 'https://poly.pizza/terms' 'https://polyhaven.com/license' 'https://api.polyhaven.com/assets?t=models' 'https://ambientcg.com/' 'https://ambientcg.com/api/v2/full_json?type=Material&limit=2' 'https://opengameart.org/art-search-advanced?field_art_type_tid%5B%5D=10&field_art_licenses_tid%5B%5D=4' 'https://api.github.com/repos/sigco3111/assets-3d-lowpoly-2'; do c=$(curl -sL -A \"$UA\" -o /tmp/p --max-time 40 -w '%{http_code}' $u); echo \"$c $(wc -c </tmp/p)B $u\" >> $GITHUB_STEP_SUMMARY; grep -oiE '.{0,100}(cc0|creative commons|public domain|licen[cs]e).{0,120}' /tmp/p | head -2 | cut -c1-240 | sed 's/^/  > /' >> $GITHUB_STEP_SUMMARY; done; for o in KenneyNL KayKit-Game-Assets ETdoFresh quaternius; do echo \"== $o\" >> $GITHUB_STEP_SUMMARY; curl -sL -A \"$UA\" https://api.github.com/users/$o/repos?per_page=100 | grep -o 'full_name[^,]*' | head -40 >> $GITHUB_STEP_SUMMARY; done"}]}}}
