name: tmp-t8j-polyhaven
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > collect.py <<'PYEOF'
          import os, io, json, zipfile, subprocess, urllib.request
          from PIL import Image
          IDS = ["ceramic_pot","cigarette_pack","combination_wrench","dining_table","long_life_food","medical_tape","old_drill_press","old_gas_mask","old_military_compressor","overhead_crane","pastic_torch_6v","plastic_crate_03","portable_generator","portable_searchlight","flood_lights"]
          LIM = 5*1024*1024
          TODAY = "2026-11-27"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=300).read()
          def sh(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              print(r.stdout[-300:], r.stderr[-300:], flush=True)
              return r.returncode
          done = []
          for pid in IDS:
              info = json.loads(get("https://api.polyhaven.com/info/" + pid))
              files = json.loads(get("https://api.polyhaven.com/files/" + pid))
              g = files["gltf"]["1k"]["gltf"]
              slug = "polyhaven-" + pid.replace("_", "-")
              zname = slug + ".zip"
              buf = io.BytesIO(); z = zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED)
              z.writestr(os.path.basename(g["url"]), get(g["url"]))
              for rel, ent in g.get("include", {}).items():
                  z.writestr(rel, get(ent["url"]))
              z.close(); data = buf.getvalue()
              print(pid, len(data), flush=True)
              th = Image.open(io.BytesIO(get("https://cdn.polyhaven.com/asset_img/thumbs/" + pid + ".png?width=512&height=512"))).convert("RGB")
              th.thumbnail((512, 512))
              pb = io.BytesIO(); th.save(pb, "PNG", optimize=True)
              os.makedirs(slug, exist_ok=True)
              open(os.path.join(slug, "preview.png"), "wb").write(pb.getvalue())
              authors = ", ".join(info.get("authors", {}).keys()) or "Poly Haven"
              name = info["name"]
              meta = {"name": "Poly Haven " + name, "slug": slug, "zip": zname, "file": None, "author": authors,
                  "url": "https://polyhaven.com/a/" + pid, "license": "CC0",
                  "attr": name + " by " + authors + ", Poly Haven (https://polyhaven.com/a/" + pid + "), CC0", "date": TODAY,
                  "tags": "3d,polyhaven,model,gltf,cc0", "notes": "Poly Haven 1K glTF 모델 zip (gltf + 텍스처). 라이선스 CC0 (polyhaven.com/license 확인)",
                  "preview": "preview.png", "kind": "3D 모델"}
              if len(data) > LIM:
                  tag = "pack-" + slug
                  open(zname, "wb").write(data)
                  sh("gh release create " + tag + " --title " + tag + " --notes 'Asset pack zip' || true")
                  sh("gh release upload " + tag + " " + zname + " --clobber")
                  os.remove(zname)
                  meta["file"] = "release:" + tag + "/" + zname
              else:
                  open(os.path.join(slug, zname), "wb").write(data)
                  meta["file"] = slug + "/" + zname
              open(os.path.join(slug, "meta.json"), "w", encoding="utf-8").write(json.dumps(meta, ensure_ascii=False, indent=1))
              open(os.path.join(slug, "LICENSE.txt"), "w", encoding="utf-8").write("CC0 1.0 Universal\nPoly Haven " + pid + ": https://polyhaven.com/a/" + pid + "\n")
              done.append(slug)
          sh("git config user.name github-actions && git config user.email actions@github.com")
          sh("git add " + " ".join(done) + " && git commit -m 'Poly Haven 모델 15종 수집 (웹 탐색 t8j)' && git pull --rebase -q origin main && git push origin HEAD:main")
          
          PYEOF
          python3 collect.py
