name: tmp-t84-pack3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os, io, json, zipfile, subprocess, urllib.request, datetime
          from PIL import Image
          REPO = 'sigco3111/assets-3d-lowpoly-2'
          UA = {'User-Agent': 'Mozilla/5.0 asset-collector'}
          TODAY = datetime.date.today().isoformat()
          def get(u, method=None, data=None):
              req = urllib.request.Request(u, headers=UA, method=method, data=data)
              with urllib.request.urlopen(req, timeout=600) as r:
                  return r.read()
          def gj(u):
              return json.loads(get(u).decode('utf-8'))
          def topng(data, path, size=512):
              im = Image.open(io.BytesIO(data)); im.seek(0)
              im = im.convert('RGBA'); im.thumbnail((size, size)); im.save(path, 'PNG', optimize=True)
          def cc0(src, who):
              try:
                  body = get('https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt').decode('utf-8', 'replace')
              except Exception as e:
                  body = 'legalcode fetch failed: %s (https://creativecommons.org/publicdomain/zero/1.0/legalcode)' % e
              return 'CC0 1.0 Universal\nSource: ' + src + '\nAuthor: ' + who + '\nChecked: ' + TODAY + ' (GitHub Actions runner)\n\n' + body
          def place(d, zipname, zb, tag):
              if len(zb) > 5 * 1024 * 1024:
                  tmp = '/tmp/' + zipname
                  open(tmp, 'wb').write(zb)
                  subprocess.run(['gh', 'release', 'create', tag, tmp, '--repo', REPO, '--title', tag, '--notes', 'Asset pack zip (5MB 초과, Releases 보관)'], check=True)
                  return 'release:%s/%s' % (tag, zipname)
              open(os.path.join(d, zipname), 'wb').write(zb)
              return '%s/%s' % (d, zipname)
          def meta(d, name, author, url, tags, attr, notes, kind, file_, zipname):
              m = {'name': name, 'slug': d, 'zip': zipname, 'file': file_, 'author': author, 'url': url, 'license': 'CC0', 'attr': attr, 'date': TODAY, 'tags': tags, 'notes': notes, 'preview': 'preview.png', 'kind': kind}
              open(os.path.join(d, 'meta.json'), 'w', encoding='utf-8').write(json.dumps(m, ensure_ascii=False, indent=1) + '\n')
          DONE = []
          def pack_tatami():
              d = 'polyhaven-tatami-mat-borderless'; os.makedirs(d, exist_ok=True)
              b = gj('https://api.polyhaven.com/files/tatami_mat_borderless')['blend']['1k']['blend']
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.writestr('tatami_mat_borderless_1k.blend', get(b['url']))
                  for rel, v in b['include'].items():
                      z.writestr(rel, get(v['url']))
              zn = 'polyhaven-tatami-mat-borderless.zip'
              fp = place(d, zn, buf.getvalue(), 'pack-polyhaven-tatami-mat-borderless')
              topng(get('https://cdn.polyhaven.com/asset_img/thumbs/tatami_mat_borderless.png?width=256&height=256&format=webp'), os.path.join(d, 'preview.png'))
              src = 'https://polyhaven.com/a/tatami_mat_borderless'
              open(os.path.join(d, 'LICENSE.txt'), 'w', encoding='utf-8').write(cc0(src, 'Charlotte Baglioni (Poly Haven)'))
              meta(d, 'Poly Haven Tatami Mat Borderless', 'Charlotte Baglioni (Poly Haven)', src, 'texture,polyhaven,tatami,floor,japanese,cc0', 'Tatami Mat Borderless by Charlotte Baglioni, Poly Haven (https://polyhaven.com/a/tatami_mat_borderless), CC0', 'Poly Haven 1K blend + 텍스처(diff/disp/nor_gl/rough) zip. 라이선스 CC0 (polyhaven.com/license 확인)', '텍스처', fp, zn)
              DONE.append(d)
          def pack_paving():
              d = 'ambientcg-pavingstones152'; os.makedirs(d, exist_ok=True)
              zb = get('https://ambientcg.com/get?file=PavingStones152_1K-JPG.zip')
              zn = 'ambientcg-pavingstones152.zip'
              fp = place(d, zn, zb, 'pack-ambientcg-pavingstones152')
              topng(get('https://acg-media.struffelproductions.com/file/ambientCG-Web/media/thumbnail/2048-WEBP/PavingStones152.webp'), os.path.join(d, 'preview.png'))
              src = 'https://ambientcg.com/a/PavingStones152'
              open(os.path.join(d, 'LICENSE.txt'), 'w', encoding='utf-8').write(cc0(src, 'ambientCG'))
              meta(d, 'ambientCG Paving Stones 152', 'ambientCG', src, 'texture,ambientcg,paving,stone,pbr,cc0', 'Paving Stones 152 by ambientCG (https://ambientcg.com/a/PavingStones152), CC0', 'ambientCG 1K-JPG PBR 텍스처 zip (8MB, Releases 보관). 라이선스 CC0 (docs.ambientcg.com/license 확인)', '텍스처', fp, zn)
              DONE.append(d)
          def pack_zombie():
              d = 'itchio-lowpoly-stylized-zombie'; os.makedirs(d, exist_ok=True)
              pz = json.loads(get('https://midnight-atoms.itch.io/lowpoly-stylized-zombie/file/20720904?source=game_download', method='POST', data=b'').decode('utf-8'))
              glb = get(pz['url'])
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.writestr('Zombie_Anim_v3.glb', glb)
              zn = 'itchio-lowpoly-stylized-zombie.zip'
              fp = place(d, zn, buf.getvalue(), 'pack-itchio-lowpoly-stylized-zombie')
              topng(get('https://img.itch.zone/aW1hZ2UvNTQxNzMyNC8zMjcwMzYxNi5naWY=/original/VVkuUl.gif'), os.path.join(d, 'preview.png'))
              src = 'https://midnight-atoms.itch.io/lowpoly-stylized-zombie'
              open(os.path.join(d, 'LICENSE.txt'), 'w', encoding='utf-8').write(cc0(src, 'Max (Midnight Atoms)'))
              meta(d, 'Lowpoly Stylized Zombie', 'Max (Midnight Atoms)', src, '3d,midnight-atoms,lowpoly,zombie,rigged,animated,cc0', 'Lowpoly Stylized Zombie by Max (Midnight Atoms), https://midnight-atoms.itch.io/lowpoly-stylized-zombie, CC0 1.0', 'itch.io 무료 다운로드(0원) GLB 리깅·애니메이션. 라이선스 CC0 1.0 (페이지 표기 확인)', '3D 모델', fp, zn)
              DONE.append(d)
          for fn in (pack_tatami, pack_paving, pack_zombie):
              try:
                  fn()
              except Exception as e:
                  print('FAIL', fn.__name__, repr(e))
          subprocess.run(['git', 'config', 'user.name', 'asset-collector'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'asset-collector@users.noreply.github.com'], check=True)
          if DONE:
              subprocess.run(['git', 'add'] + DONE, check=True)
              subprocess.run(['git', 'commit', '-m', '에셋: Tatami Mat Borderless, Paving Stones 152, Lowpoly Stylized Zombie 추가'], check=True)
              subprocess.run(['git', 'pull', '--rebase', '-q', 'origin', 'main'], check=True)
              subprocess.run(['git', 'push', '-q', 'origin', 'HEAD:main'], check=True)
          print('DONE', DONE)
          PY
