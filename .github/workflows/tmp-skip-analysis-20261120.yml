{"name":"tmp-skip-analysis-20261120","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"analyze":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"analysis (dry-run)","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 - <<'PY'\nimport json, re, subprocess, urllib.request, os, sys\nwf = json.load(open('.github/workflows/auto-collect.yml'))\nrun = [s for s in wf['jobs']['collect']['steps'] if s.get('name') == 'collect'][0]['run']\ni = run.index(\"<<'PY'\")\nbody = run[run.index(chr(10), i) + 1:]\nbody = body[:body.rindex(chr(10) + 'PY')]\ndef rep(s, a, b):\n    if a not in s: raise SystemExit('PATCH MISS: ' + a)\n    return s.replace(a, b)\nbody = rep(body, \"MAXP = int(os.environ.get('MAXP') or '2')\", \"MAXP = 100000\")\nbody = rep(body, \"DRY = (os.environ.get('DRY') or 'false').lower() == 'true'\", \"DRY = True\")\nbody = rep(body, 'seen >= 150', 'seen >= 600')\nbody = rep(body, 'for pg in range(6)', 'for pg in range(12)')\nbody = rep(body, \"def finish(code=0):\", \"def size_of(u):\\n    try:\\n        with urllib.request.urlopen(urllib.request.Request(u, method='HEAD', headers=UA), timeout=60) as r:\\n            return int(r.headers.get('Content-Length') or -1)\\n    except Exception:\\n        return -2\\ndef finish(code=0):\")\nbody = rep(body, \"log('CANDIDATE %s |\", \"SZ = size_of(p['atts'][0]); log('SIZE %s %d' % (slug, SZ)); log('CANDIDATE %s |\")\nopen('/tmp/collect_dry.py', 'w', encoding='utf-8').write(body)\nr = subprocess.run(['python3', '/tmp/collect_dry.py'], capture_output=True, text=True)\nopen('/tmp/log.txt', 'w', encoding='utf-8').write(r.stdout + chr(10) + '--- STDERR rc=%d ---' % r.returncode + chr(10) + r.stderr[-3000:])\nL = [l for l in r.stdout.splitlines()]\ndef fams(lic):\n    u = lic.upper(); f = set()\n    if re.search(r'CC0|CC 0|PUBLIC DOMAIN DEDICATION', u): f.add('CC0')\n    if re.search(r'CC[ -]?BY[ -]?4\\.0', u): f.add('CC-BY 4.0')\n    if re.search(r'CC[ -]?BY[ -]?3\\.0', u): f.add('CC-BY 3.0')\n    if re.search(r'OGA[ -]?BY[ -]?4\\.0', u): f.add('OGA-BY 4.0')\n    if re.search(r'OGA[ -]?BY[ -]?3\\.0', u): f.add('OGA-BY 3.0')\n    if re.search(r'\\bMIT\\b', u): f.add('MIT')\n    if re.search(r'GPL[ -]?(V ?)?3', u): f.add('GPL 3.0')\n    if re.search(r'GPL[ -]?(V ?)?2', u): f.add('GPL 2.0')\n    return f\ncats = {}\nex = {}\ndef add(k, line):\n    cats[k] = cats.get(k, 0) + 1\n    ex.setdefault(k, [])\n    if len(ex[k]) < 3: ex[k].append(line[:220])\nsimple = [('SKIP folder-exists','folder-exists'),('SKIP dup-name','already-registered(name)'),('SKIP dup ','already-registered(url)'),('SKIP fetch','다운로드·페이지 실패'),('SKIP no-attachment','첨부 없음'),('SKIP no-preview','기타: 미리보기 이미지 없음'),('SKIP author-parse','작성자 파싱 실패')]\nlic_raw = {}\nsizes = {}\ncand = []\nfor l in L:\n    hit = False\n    for pre, k in simple:\n        if l.startswith(pre):\n            add(k, l); hit = True; break\n    if hit: continue\n    if l.startswith('SKIP license'):\n        raw = l.split('[', 1)[1].rstrip(']') if '[' in l else ''\n        lic_raw[raw] = lic_raw.get(raw, 0) + 1\n        n = len(fams(raw)); u = raw.upper()\n        if n >= 2: add('라이선스: 복수 라이선스', l)\n        elif re.search(r'-NC\\b|NON.?COMMERCIAL|-ND\\b|NO.?DERIV|-SA\\b|SHARE.?ALIKE', u): add('라이선스: NC/ND/SA 변형', l)\n        else: add('라이선스: 허용 목록 밖', l)\n    elif l.startswith('SIZE '):\n        p = l.split(); sizes[p[1]] = int(p[2])\n    elif l.startswith('CANDIDATE '):\n        cand.append(l)\nover = []; headfail = []; passed = []\nfor l in cand:\n    slug = l.split()[1]; n = sizes.get(slug, -1)\n    if n > 26214400: over.append(slug); add('25MB 초과', l)\n    elif n == -2: headfail.append(slug); add('다운로드 실패(첨부 HEAD)', l)\n    else: passed.append(slug)\nout = ['# 3D 수집 사유 분석 2026-11-20 (dry-run, 적용 없음)', '', '## 집계']\nfor k in ['folder-exists','already-registered(url)','already-registered(name)','다운로드·페이지 실패','첨부 없음','작성자 파싱 실패','기타: 미리보기 이미지 없음','라이선스: 복수 라이선스','라이선스: NC/ND/SA 변형','라이선스: 허용 목록 밖','25MB 초과','다운로드 실패(첨부 HEAD)']:\n    out.append('- %s: %d' % (k, cats.get(k, 0)))\nout.append('- 통과(후보, max_packs 제한 없음): %d' % len(passed))\nout.append('')\nout.append('## 라이선스 문자열 빈도')\nfor k, v in sorted(lic_raw.items(), key=lambda x: -x[1]): out.append('- %d × [%s]' % (v, k))\nout.append('')\nout.append('## 예시(사유별 최대 3)')\nfor k, v in ex.items():\n    out.append('### ' + k)\n    for x in v: out.append('- ' + x)\nout.append('')\nout.append('## raw log')\nout += L\nos.makedirs('docs', exist_ok=True)\nopen('docs/skip-analysis-20261120.md', 'w', encoding='utf-8').write(chr(10).join(out) + chr(10))\nprint(chr(10).join(out[:60]))\n\nPY\n"},{"name":"commit report","run":"git add docs/skip-analysis-20261120.md && git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'tmp: skip analysis report' && git push origin HEAD:main"}]}}}
