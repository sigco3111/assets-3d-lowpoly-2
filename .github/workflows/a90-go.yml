name: a90-go
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ingest
        run: |
          set -e
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          sudo apt-get update -y -q || true
          sudo apt-get install -y -q python3-pil || python3 -m pip install --user --break-system-packages --quiet pillow
          python3 .github/scripts/a90_3d.py
