name: tmp a100 clean 3d

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clean
        run: |
          git rm -r -q --ignore-unmatch .github/workflows/tmp-a100-3d.yml .github/workflows/tmp-a100-3d2.yml .github/workflows/tmp-a100-3d3.yml .github/workflows/tmp-a100-3d4.yml .github/workflows/tmp-a100-3d5.yml .github/workflows/tmp-a100-3d6.yml .github/workflows/tmp-a100-clean-3d.yml tools/tmp_a100_3d.py tools/tmp_a100_3d2.py tools/tmp_a100_3d3.py tools/tmp_a100_3d4.py tools/tmp_a100_3d5.py tools/tmp_a100_3d6.py a100_log.txt
          git -c user.name="sigco3111" -c user.email="sigco3111k@gmail.com" commit -m "정리: A100 임시 파일 삭제" || true
          git push origin HEAD:main
