name: a92-run3d
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ingest
        run: |
          set -uo pipefail
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          rm -rf /tmp/cat
          git clone -q --depth 1 https://github.com/sigco3111/game-asset-catalog /tmp/cat || true
          if [ ! -s /tmp/cat/catalog.csv ]; then echo "FATAL no catalog"; exit 1; fi
          CAT=/tmp/cat/catalog.csv
          cat > /tmp/packs.tsv <<'EOF'
          Modular Medieval House Pack 01|modular-medieval-house-pack-01|https://opengameart.org/content/modular-medieval-house-pack-01|hreikin|CC0|3D 건물|building,medieval,modular,lowpoly
          Retro Medieval Kit|retro-medieval-kit|https://opengameart.org/content/retro-medieval-kit|Kenney|CC0|3D 환경|medieval,retro,lowpoly,kenney
          Desert - Low Poly Toon Battle Arena / Tower Defense Pack|desert-low-poly-toon-battle-arena|https://opengameart.org/content/desert-low-poly-toon-battle-arena|BenjaTheMaker|CC0|3D 환경|desert,toon,lowpoly,towerdefense
          Low poly CC0: Western Objects Pack|low-poly-cc0-western-objects-pack|https://opengameart.org/content/low-poly-cc0-western-objects-pack|Lucian Pavel|CC0|3D 소품|western,props,lowpoly,mobile
          Stylised Fantasy Weapons|stylised-fantasy-weapons|https://opengameart.org/content/stylised-fantasy-weapons|mastahcez|CC-BY 3.0|3D 무기|weapon,fantasy,lowpoly,stylised
          RTS medieval props|rts-medieval-props|https://opengameart.org/content/rts-medieval-props|hreikin|CC0|3D 소품|rts,medieval,props
          Low poly Nature Project|low-poly-nature-project|https://opengameart.org/content/low-poly-nature-project|NdeSoh|CC0|3D 환경|nature,trees,lowpoly
          Food Pack: Cooking|food-pack-cooking|https://opengameart.org/content/food-pack-cooking|Clint Bellanger|CC-BY 3.0|3D 소품|food,props,lowpoly
          Objects in a house|objects-in-a-house|https://opengameart.org/content/objects-in-a-house|hreikin|CC0|3D 소품|house,furniture,props
          Archery Set|archery-set|https://opengameart.org/content/archery-set|yd|CC0|3D 소품|weapon,archery,bow,props
          Low-poly plants|low-poly-plants|https://opengameart.org/content/low-poly-plants|Tfoust10|CC0|3D 환경|plants,nature,lowpoly
          RTS medieval props2|rts-medieval-props-2|https://opengameart.org/content/rts-medieval-props-2|hreikin|CC0|3D 소품|rts,medieval,props
          EOF
          : > /tmp/res.txt
          ADDED=0
          while IFS='|' read -r NAME SLUG PAGE AUTHOR LIC TYPE TAGS; do
            [ -z "$NAME" ] && continue
            [ "$ADDED" -ge 3 ] && break
            if [ -d "$SLUG" ]; then echo "SKIP exists $SLUG"; continue; fi
            if grep -qF "$NAME," "$CAT"; then echo "SKIP dup $NAME"; continue; fi
            curl -sSL -m 60 "$PAGE" -o /tmp/page.html || { echo "SKIP pagefail $NAME"; continue; }
            FILEURL=$(grep -o 'href="[^"]*sites/default/files/[^"]*"' /tmp/page.html | sed 's/^href="//;s/"$//' | grep -Ei '\.(zip|7z|rar|tar\.gz|tgz)$' | head -1)
            if [ -z "$FILEURL" ]; then echo "SKIP nofile $NAME"; continue; fi
            case "$FILEURL" in /*) FILEURL="https://opengameart.org$FILEURL";; esac
            EXT="${FILEURL##*.}"
            mkdir -p "$SLUG/.tmp"
            curl -sSL -m 300 "$FILEURL" -o "$SLUG/.tmp/pack.$EXT" || { echo "SKIP dl $NAME"; rm -rf "$SLUG"; continue; }
            SZ=$(stat -c%s "$SLUG/.tmp/pack.$EXT")
            if [ "$SZ" -lt 2000 ]; then echo "SKIP tiny $NAME"; rm -rf "$SLUG"; continue; fi
            mkdir -p "$SLUG/.tmp/x"
            if [ "$EXT" = "zip" ]; then unzip -o -q "$SLUG/.tmp/pack.zip" -d "$SLUG/.tmp/x" >/dev/null 2>&1 || true; fi
            if [ "$EXT" = "7z" ]; then 7z x -y -o"$SLUG/.tmp/x" "$SLUG/.tmp/pack.7z" >/dev/null 2>&1 || true; fi
            IMG=$(find "$SLUG/.tmp/x" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -size +8k -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -1 | cut -f2)
            if [ -z "$IMG" ]; then
              OG=$(grep -o 'property="og:image" content="[^"]*"' /tmp/page.html | head -1 | sed 's/.*content="//;s/"$//')
              if [ -n "$OG" ]; then curl -sSL -m 60 "$OG" -o "$SLUG/.tmp/og.img" || true; if [ -s "$SLUG/.tmp/og.img" ]; then IMG="$SLUG/.tmp/og.img"; fi; fi
            fi
            mkdir -p previews
            PV=""
            if [ -n "$IMG" ] && [ -f "$IMG" ]; then
              convert "$IMG" -resize '480x480>' -strip "previews/$SLUG.png" >/dev/null 2>&1 || true
              if [ -s "previews/$SLUG.png" ]; then
                if [ "$(stat -c%s "previews/$SLUG.png")" -gt 204800 ]; then
                  convert "$IMG" -resize '480x480>' -strip -quality 85 "previews/$SLUG.jpg" >/dev/null 2>&1 || true
                  rm -f "previews/$SLUG.png"
                  if [ -s "previews/$SLUG.jpg" ]; then PV="previews/$SLUG.jpg"; fi
                else
                  PV="previews/$SLUG.png"
                fi
              fi
            fi
            mv "$SLUG/.tmp/pack.$EXT" "$SLUG/$SLUG.$EXT"
            rm -rf "$SLUG/.tmp"
            git add "$SLUG/$SLUG.$EXT"
            git commit -q -m "에셋: $NAME 추가"
            if [ -n "$PV" ]; then git add "$PV"; git commit -q -m "썸네일: $NAME 추가"; fi
            echo "$NAME|$SLUG|$SLUG/$SLUG.$EXT|$PV|$LIC|$TYPE|$AUTHOR|$PAGE|$TAGS" >> /tmp/res.txt
            echo "ADDED $NAME $PV"
            ADDED=$((ADDED+1))
          done < /tmp/packs.tsv
          cp /tmp/res.txt a92-res.txt
          git add a92-res.txt
          git commit -q -m "A92 결과 기록" || true
          git push origin HEAD:main
          cat /tmp/res.txt
