{"name":"tmp-q1-read","on":{"push":{"branches":["main"],"paths":[".github/workflows/collect-q1.yml"]}},"jobs":{"q":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"read quaternius page","run":"python3 - <<'PY'\nimport csv, io, re, urllib.request, sys, traceback\nUA={'User-Agent':'asset-collector'}\ndef get(u):\n    return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60).read().decode('utf-8','replace')\ntry:\n    cat = list(csv.DictReader(io.StringIO(open('catalog.csv','rb').read().decode('utf-8'), newline='')))\n    print('::notice::Q1 catalog_rows=%d' % len(cat))\n    for r in cat:\n        if 'animated' in r['name'].lower() and 'gun' in r['name'].lower() or 'quaternius.com/packs/animatedguns' in (r.get('source_url') or ''):\n            print('::notice::Q1 DUP name=%s repo=%s source=%s' % (r['name'], r['repo'], r['source_url']))\n    html = get('https://quaternius.com/packs/animatedguns.html')\n    print('::notice::Q1 html_bytes=%d' % len(html))\n    lic = re.findall(r'License[^<]{0,80}|CC0[^<]{0,40}|QAL[^<]{0,60}', html)\n    print('::notice::Q1 license_hits=%s' % ' | '.join(sorted(set(x.strip() for x in lic)))[:600])\n    hrefs = re.findall(r'href=\"([^\"]+)\"', html)\n    keep = [h for h in hrefs if re.search(r'\\.zip|drive\\.google|itch\\.io|download|\\.7z|\\.rar', h, re.I)]\n    for h in sorted(set(keep))[:20]:\n        print('::notice::Q1 link ' + h[:200])\n    print('::notice::Q1 total_href=%d download_like=%d' % (len(hrefs), len(keep)))\nexcept BaseException as e:\n    print('::error::Q1 ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace('\\n',' '))\n    traceback.print_exc()\n    sys.exit(1)\nPY\n"}]}}}
