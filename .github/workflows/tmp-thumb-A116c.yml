{"name":"tmp thumb A116c","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"fix":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"pip3 install -q --break-system-packages pillow || pip3 install -q --user pillow || true"},{"run":"curl -sSL -A 'Mozilla/5.0' -o /tmp/fleur.jpg https://opengameart.org/sites/default/files/fleur_scaled.jpg; ls -l /tmp/fleur.jpg || true"},{"run":"cat > /tmp/fix.py <<'EOF'\nimport glob,io,os,sys,zipfile\nL=[]\ndef log(*a): L.append(' '.join(str(x) for x in a))\ntry:\n    from PIL import Image\nexcept Exception as e:\n    Image=None; log('NO PIL',repr(e))\nG='goth-female-fleur-du-mal'\nGp='3d-gun-part-1-free-version/preview.png'\ntry:\n    if Image is None: raise RuntimeError('no PIL')\n    if os.path.exists('/tmp/fleur.jpg') and os.path.getsize('/tmp/fleur.jpg')>1000:\n        im=Image.open('/tmp/fleur.jpg').convert('RGBA'); log('src oga fleur.jpg',im.size)\n        im.thumbnail((1024,1024)); im.save(G+'/preview.png',optimize=True)\n        log('goth preview bytes',os.path.getsize(G+'/preview.png'),im.size)\n    zp=glob.glob(G+'/*.zip') if not os.path.exists(G+'/preview.png') or 'src oga' not in ' '.join(L) else []\n    if not zp: raise RuntimeError('done via oga')\n    log('zips',zp)\n    zf=zipfile.ZipFile(zp[0])\n    names=zf.namelist()\n    log('entries',len(names))\n    c=[]\n    for n in names:\n        if n.lower().endswith(('.png','.jpg','.jpeg')) and not n.endswith('/'):\n            try:\n                im=Image.open(io.BytesIO(zf.read(n)))\n                c.append((im.size[0]*im.size[1],n,im.size))\n            except Exception as e:\n                log('skip',n,repr(e))\n    c.sort(reverse=True)\n    for x in c[:25]: log('cand',x)\n    pick=[x for x in c if any(k in x[1].lower() for k in ('preview','render','screenshot'))] or c\n    log('pick',pick[0])\n    im=Image.open(io.BytesIO(zf.read(pick[0][1]))).convert('RGBA')\n    im.thumbnail((1024,1024))\n    im.save(G+'/preview.png',optimize=True)\n    log('goth preview bytes',os.path.getsize(G+'/preview.png'),im.size)\nexcept Exception as e:\n    log('GOTH ERROR',repr(e))\ntry:\n    if Image is None: raise RuntimeError('no PIL')\n    log('gun before',os.path.getsize(Gp))\n    g=Image.open(Gp)\n    log('gun mode',g.mode,g.size)\n    g=g.convert('RGB')\n    g.thumbnail((960,960))\n    g.save(Gp,optimize=True)\n    log('gun after',os.path.getsize(Gp),g.size)\nexcept Exception as e:\n    log('GUN ERROR',repr(e))\nopen('tmp-thumb-diag.txt','w').write('\\n'.join(L)+'\\n')\nEOF\npython3 /tmp/fix.py; cat tmp-thumb-diag.txt || true"},{"if":"always()","run":"git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -A goth-female-fleur-du-mal 3d-gun-part-1-free-version\n[ -f tmp-thumb-diag.txt ] && git add tmp-thumb-diag.txt\ngit diff --cached --quiet || git commit -m '에셋: 썸네일 보완 (Goth female, Gun Part 1)'\ngit push origin HEAD:main"}]}}}
