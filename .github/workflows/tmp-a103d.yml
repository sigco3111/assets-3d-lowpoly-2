name: tmp-a103d
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import csv, io, os, re, subprocess, urllib.request, zipfile, shutil
          TAG = 'v1.0'
          MAXN = 2
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'}
          def get(u, binary=False):
              req = urllib.request.Request(u, headers=UA)
              data = urllib.request.urlopen(req, timeout=300).read()
              return data if binary else data.decode('utf-8', 'replace')
          def plain(s):
              return re.sub(r'<[^>]+>', ' ', s)
          def slugify(t):
              return re.sub(r'[^a-z0-9]+', '-', t.lower()).strip('-')
          try:
              cat = get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv')
          except Exception:
              cat = ''
          names = set()
          if cat:
              for row in csv.DictReader(io.StringIO(cat)):
                  names.add((row.get('name') or '').strip().lower())
          try:
              cc0 = get('https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt')
          except Exception:
              cc0 = 'CC0 1.0 Universal (Public Domain Dedication)'
          cands = []
          seen = set()
          for pg in (2, 3, 4):
              u = 'https://opengameart.org/art-search-advanced?field_art_type_tid%5B%5D=10&sort_by=created&sort_order=DESC&items_per_page=96&page=' + str(pg)
              try:
                  lst = get(u)
              except Exception:
                  continue
              for href, txt in re.findall(r'href="(/content/[^"]+)"[^>]*>([^<]{2,150})</a>', lst):
                  t = plain(txt).strip()
                  if not t or href in cands:
                      continue
                  if t.lower() in names or href in seen:
                      continue
                  seen.add(href)
                  cands.append((t, 'https://opengameart.org' + href))
          out = ['CANDIDATES %d' % len(cands)]
          done = 0
          for title, page in cands:
              if done >= MAXN or len(out) > 80:
                  break
              try:
                  html = get(page)
              except Exception as e:
                  out.append('ERRPAGE %s' % title)
                  continue
              li = html.find('License(s)')
              licseg = plain(html[li:li + 1200]) if li >= 0 else ''
              ok0 = ('CC0' in licseg) or ('CC-BY 4' in licseg) or ('CC-BY 3' in licseg)
              if not ok0 or 'CC-BY-SA' in licseg or 'OGA-BY' in licseg or '-NC' in licseg:
                  out.append('LICFAIL ' + title)
                  continue
              lic = 'CC0' if 'CC0' in licseg else ('CC-BY 4.0' if 'CC-BY 4' in licseg else 'CC-BY 3.0')
              zs = re.findall(r'href="((?:https://opengameart\.org)?/sites/default/files/[^"]+\.zip)"', html)
              if not zs:
                  out.append('NOZIP ' + title)
                  continue
              zurl = zs[0] if zs[0].startswith('http') else 'https://opengameart.org' + zs[0]
              zname = zurl.split('/')[-1]
              try:
                  data = get(zurl, True)
              except Exception as e:
                  out.append('ERRZIP ' + title)
                  continue
              size = len(data)
              if size > 20 * 1024 * 1024:
                  out.append('TOOBIG %s %d' % (title, size))
                  continue
              tmp = '/tmp/' + zname
              open(tmp, 'wb').write(data)
              try:
                  zf = zipfile.ZipFile(tmp)
                  fnames = [n for n in zf.namelist() if not n.endswith('/') and '__MACOSX' not in n]
              except Exception:
                  out.append('BADZIP ' + title)
                  continue
              if len(fnames) < 5:
                  out.append('SMALL %s %d' % (title, len(fnames)))
                  continue
              slug = slugify(title)
              if not slug or os.path.isdir(slug):
                  out.append('EXISTS ' + title)
                  continue
              am = re.search(r'Author:.*?<a[^>]*>([^<]+)</a>', html, re.S)
              author = am.group(1).strip() if am else 'unknown'
              m = re.search(r'property="og:image" content="([^"]+)"', html)
              prev = m.group(1) if m else ''
              exports = {}
              for n in fnames:
                  e2 = os.path.splitext(n)[1].lower()
                  exports[e2] = exports.get(e2, 0) + 1
              ext_txt = ', '.join('%s %d' % (k or 'none', v) for k, v in sorted(exports.items(), key=lambda x: -x[1])[:5])
              d = slug
              os.makedirs(d, exist_ok=True)
              if size > 5 * 1024 * 1024:
                  subprocess.run(['gh', 'release', 'create', TAG, '--title', TAG, '--notes', 'release assets'], check=False, capture_output=True)
                  subprocess.run(['gh', 'release', 'upload', TAG, tmp, '--clobber'], check=False)
                  file_col = 'releases/download/%s/%s' % (TAG, zname)
              else:
                  shutil.copy(tmp, os.path.join(d, zname))
                  file_col = '%s/%s' % (slug, zname)
              pv_rel = ''
              if prev:
                  ext = os.path.splitext(prev.split('?')[0])[1].lower()
                  if ext not in ('.png', '.jpg', '.jpeg'):
                      ext = '.png'
                  try:
                      pdata = get(prev, True)
                      if len(pdata) > 1000:
                          open(os.path.join(d, 'preview' + ext), 'wb').write(pdata)
                          pv_rel = '%s/preview%s' % (slug, ext)
                  except Exception:
                      pass
              open(os.path.join(d, 'LICENSE-SOURCE.txt'), 'w').write(title + '\n\n출처 URL: ' + page + '\n표기 라이선스: ' + lic + '\n제작자: ' + author + '\n')
              if lic == 'CC0':
                  open(os.path.join(d, 'LICENSE-CC0.txt'), 'w').write(cc0)
              open(os.path.join(d, 'CREDITS.txt'), 'w').write(title + ' - ' + author + '\n라이선스: ' + lic + '\n출처: ' + page + '\n')
              md = ['# ' + title, '',
                    '- 출처 URL: ' + page,
                    '- 받은 파일: %s (%.1fMB)' % (zname, size / 1048576.0),
                    '- 라이선스: ' + lic,
                    '- 제작자: ' + author,
                    '- 파일 수: %d' % len(fnames),
                    '- 파일 크기(바이트): %d' % size,
                    '- 태그: lowpoly,3d',
                    '- AI 생성 여부: 출처 페이지에 언급 없음']
              open(os.path.join(d, 'pack.md'), 'w').write('\n'.join(md) + '\n')
              subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=False)
              subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=False)
              subprocess.run(['git', 'add', d], check=False)
              r = subprocess.run(['git', 'commit', '-m', '에셋: ' + title + ' 추가'], capture_output=True, text=True)
              subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=False, capture_output=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
              done += 1
              out.append('OK %s | page=%s | file=%s | preview=%s | bytes=%d | files=%d | author=%s | license=%s | ext=%s | rc=%s' % (slug, page, file_col, pv_rel, size, len(fnames), author, lic, ext_txt, r.returncode))
          open('tmp-a103-summary.txt', 'w').write('\n'.join(out) + '\n')
          print('\n'.join(out[-25:]))
          subprocess.run(['git', 'add', 'tmp-a103-summary.txt'], check=False)
          subprocess.run(['git', 'commit', '-m', 'tmp: A103 3D 요약'], check=False, capture_output=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          
          PY
