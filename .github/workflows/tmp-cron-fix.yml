name: tmp-cron-fix
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cron 수정
        run: |
          set -e
          f=.github/workflows/auto-collect.yml
          grep -q '"cron":"10 \* \* \* \*"' "$f"
          sed -i 's/"cron":"10 \* \* \* \*"/"cron":"23 * * * *"/' "$f"
          grep -o '"cron":"[^"]*"' "$f"
          git rm -q .github/workflows/auto-collect2.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "자동 수집 cron 을 :23 으로 변경, 복제본 auto-collect2 제거" || echo nothing
          git push
