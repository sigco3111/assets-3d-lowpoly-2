name: A97 add
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: add packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          pip install --quiet pillow
          cat > /tmp/add.py <<'PY'
          import os, re, subprocess, urllib.request, io, zipfile, shutil, json
          from PIL import Image

          UA = {"User-Agent": "Mozilla/5.0 (compatible; asset-collector/1.0)"}

          def fetch(url):
              err = None
              for _ in range(3):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=180).read()
                  except Exception as e:
                      err = e
              raise err

          def sh(cmd):
              print("+", cmd, flush=True)
              subprocess.run(cmd, shell=True, check=True)

          PACKS = [
           dict(folder="golem-knight", name="Golem Knight",
             page="https://opengameart.org/content/golem-knight",
             author="Q2DENJINDREW", date="2026-11-13", tags="knight,monster,animated,3d",
             ai="출처 페이지에 언급 없음"),
           dict(folder="painting-pack", name="Painting Pack",
             page="https://opengameart.org/content/painting-pack",
             author="EmoPreben", date="2026-11-15", tags="painting,prop,frame,3d",
             ai="출처 페이지에 언급 없음 (텍스처 출처 표기는 출처 페이지 참고)"),
          ]

          LIMIT = 5 * 1024 * 1024
          for p in PACKS:
              html = fetch(p["page"]).decode("utf-8", "ignore")
              m = re.search(r'property="og:image"\s+content="([^"]+)"', html)
              og = m.group(1) if m else None
              zips = re.findall(r'href="((?:https://opengameart\.org)?/sites/default/files/[^"]+\.zip)"', html)
              if not zips:
                  raise SystemExit("no zip for " + p["folder"])
              zurl = zips[0]
              if zurl.startswith("/"):
                  zurl = "https://opengameart.org" + zurl
              data = fetch(zurl)
              base = os.path.basename(zurl.split("?")[0])
              folder = p["folder"]
              os.makedirs(folder, exist_ok=True)
              tmp = "/tmp/" + base
              open(tmp, "wb").write(data)
              count = len([n for n in zipfile.ZipFile(tmp).namelist() if not n.endswith("/")])
              size_mb = round(len(data) / 1048576, 1)
              size_kb = round(len(data) / 1024, 1)
              if len(data) > LIMIT:
                  tag = "a97-" + folder
                  sh('gh release create ' + tag + ' ' + tmp + ' --repo sigco3111/assets-3d-lowpoly-2 --title "' + p["name"] + '" --notes "원본 배포물 zip" || true')
                  filepath = "releases/download/" + tag + "/" + base
                  where = "릴리스 첨부"
              else:
                  shutil.copy(tmp, os.path.join(folder, base))
                  filepath = folder + "/" + base
                  where = "저장소 내 포함"
              disp = (str(size_mb) + "MB") if len(data) > 1048576 else (str(size_kb) + "KB")
              if og:
                  im = Image.open(io.BytesIO(fetch(og))).convert("RGB")
                  im.save(os.path.join(folder, "preview.jpg"), quality=88)
              with open(os.path.join(folder, "pack.md"), "w") as f:
                  f.write("# " + p["name"] + "\n\n")
                  f.write("- 출처 URL: " + p["page"] + "\n")
                  f.write("- 받은 파일: " + base + " (" + disp + ")\n")
                  f.write("- 라이선스: CC0\n")
                  f.write("- 제작자: " + p["author"] + "\n")
                  f.write("- 공개일: " + p["date"] + "\n")
                  f.write("- 파일 수: " + str(count) + "\n")
                  f.write("- 파일 크기(바이트): " + str(len(data)) + "\n")
                  f.write("- 태그: " + p["tags"] + "\n")
                  f.write("- 표기 요구: 없음 (CC0)\n")
                  f.write("- AI 생성 여부: " + p["ai"] + "\n")
              with open(os.path.join(folder, "LICENSE-SOURCE.txt"), "w") as f:
                  f.write(p["name"] + "\n\n")
                  f.write("출처 URL: " + p["page"] + "\n")
                  f.write("표기 라이선스: CC0\n")
                  f.write("제작자: " + p["author"] + "\n")
                  f.write("공개일: " + p["date"] + "\n\n")
                  f.write("이 파일은 수집자가 출처 페이지의 라이선스 표기를 기록한 것입니다.\n")
                  f.write("원본 배포물에 라이선스 파일이 포함되어 있지 않으면 이 파일이 그 역할을 합니다.\n")
              with open("README.md", "a") as f:
                  f.write("\n\n### " + p["name"] + "\n")
                  f.write("![" + p["name"] + " 미리보기](" + folder + "/preview.jpg)\n")
                  f.write("- 파일: `" + base + "` (" + disp + ") — " + where + "\n")
                  f.write("- 제작: " + p["author"] + " / 라이선스: CC0 / 원본: " + p["page"] + "\n")
              sh("git add -A")
              sh('git commit -m "에셋: ' + p["name"] + ' 추가"')
              sh("git push origin HEAD:main")
              print("DONE " + json.dumps(dict(pack=p["name"], file=filepath, count=count, size=len(data), where=where), ensure_ascii=False))

PY
          python3 /tmp/add.py
      - name: cleanup
        if: always()
        run: |
          git rm -f .github/workflows/tmp-a97.yml || true
          git commit -m "정리: A97 임시 파일 삭제" || true
          git push origin HEAD:main || true
