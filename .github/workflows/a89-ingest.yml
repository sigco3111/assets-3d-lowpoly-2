name: A89 ingest
on: push
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/a89.sh
      - name: 에셋 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git add .github low-poly-swords
          git commit -m "에셋: low_poly_swords 추가"
          git add 3d-character-pack
          git commit -m "에셋: 3D Character Pack 추가"
          git add 3d-human-parts-pack
          git commit -m "에셋: 3D Human Parts Pack 추가"
          git push
      - name: README 갱신
        run: |
          printf '\n### low_poly_swords\n- 파일: swords_obj.zip / 제작: Q2DENJINDREW / 라이선스: CC0 / 원본: https://opengameart.org/content/lowpolyswords\n\n### 3D Character Pack\n- 파일: bravos_game_br_2024.zip / 제작: byzmod3d / 라이선스: CC0 / 원본: https://opengameart.org/content/3d-character-pack\n\n### 3D Human Parts Pack\n- 파일: 3d_human_parts_pack.zip / 제작: byzmod3d / 라이선스: CC0 / 원본: https://opengameart.org/content/3d-human-parts-pack\n' >> README.md
          git add README.md
          git commit -m "에셋: README 갱신 (A89)"
          git push
