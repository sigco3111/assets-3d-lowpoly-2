{"name":"tmp-a115-ing","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":25,"steps":[{"name":"collect","env":{"GH_TOKEN":"${{ github.token }}"},"run":"python3 - <<'PY'\nimport os, re, json, base64, io, zipfile, urllib.request, urllib.parse, html, datetime\nTOKEN = os.environ[\"GH_TOKEN\"]\nREPO = os.environ[\"GITHUB_REPOSITORY\"]\nMAX_PACKS = 3\nMAX_CAND = 80\nUA = {\"User-Agent\": \"Mozilla/5.0 (asset-collector)\"}\nTODAY = datetime.date.today().isoformat()\n\ndef get(url):\n    with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=90) as r:\n        return r.read()\n\ndef api(method, path, body=None):\n    data = json.dumps(body).encode() if body is not None else None\n    req = urllib.request.Request(\"https://api.github.com\" + path, method=method, data=data,\n        headers={\"Authorization\": \"Bearer \" + TOKEN, \"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"asset-collector\"})\n    with urllib.request.urlopen(req, timeout=180) as r:\n        raw = r.read()\n        return json.loads(raw) if raw else {}\n\ncat = get(\"https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv\").decode(\"utf8\", \"ignore\").lower()\nprint(\"CATALOG_CHARS\", len(cat))\n\nslugs = []\nfor tpl in [\n    \"https://opengameart.org/art-search-advanced?field_art_type_tid%5B%5D=10&sort_by=created&sort_order=DESC&page=%d\",\n    \"https://opengameart.org/art-search-advanced?field_art_type_tid%5B%5D=10&sort_by=count&sort_order=DESC&page=%d\",\n]:\n    for p in range(6):\n        try:\n            h = get(tpl % p).decode(\"utf8\", \"ignore\")\n        except Exception as ex:\n            print(\"LISTERR\", p, str(ex)[:120]); continue\n        for s in re.findall(r'href=\"/content/([a-z0-9][a-z0-9_\\-]*)\"', h):\n            if s not in slugs: slugs.append(s)\nprint(\"CANDIDATES\", len(slugs))\n\nALLOW = re.compile(r'\\bCC0\\b|CC-BY[ -]?(?:3|4)\\.0|\\bMIT\\b|GPL[ -]?(?:2|3)(?:\\.0)?|OGA-BY[ -]?(?:3|4)\\.0')\nDENY = re.compile(r'\\bSA\\b|\\bNC\\b|\\bND\\b|Non-?Commercial|No Derivative|Share Alike|Public Domain|LGPL|GFDL')\n\ndef lic_tokens(page):\n    i = page.find(\"License(s)\")\n    if i < 0: i = page.find(\"License\")\n    if i < 0: return None\n    seg = re.sub(r\"\\s+\", \" \", html.unescape(re.sub(r\"<[^>]+>\", \" \", page[i:i + 500])))\n    if DENY.search(seg): return None\n    toks = []\n    for m in ALLOW.finditer(seg):\n        if m.group(0) not in toks: toks.append(m.group(0))\n    return toks or None\n\ndef lic_text_url(tok):\n    t = tok.upper()\n    if \"CC0\" in t: return \"https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt\"\n    if \"CC\" in t and \"BY\" in t:\n        return \"https://creativecommons.org/licenses/by/4.0/legalcode.txt\" if \"4.0\" in t else \"https://creativecommons.org/licenses/by/3.0/legalcode\"\n    if \"GPL\" in t:\n        return \"https://www.gnu.org/licenses/gpl-3.0.txt\" if \"3\" in t else \"https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt\"\n    return None\n\nadded = []\nskips = []\nfor s in slugs[:MAX_CAND]:\n    if len(added) >= MAX_PACKS: break\n    src = \"https://opengameart.org/content/\" + s\n    if re.search(re.escape(\"/content/\" + s) + r\"(?![a-z0-9_\\-])\", cat):\n        skips.append(s + \": 포털 등록됨(URL 중복)\"); continue\n    try:\n        page = get(src).decode(\"utf8\", \"ignore\")\n    except Exception as ex:\n        skips.append(s + \": 페이지 실패 \" + str(ex)[:60]); continue\n    toks = lic_tokens(page)\n    if not toks:\n        skips.append(s + \": 허용 라이선스 아님/불명확\"); continue\n    t = re.search(r\"<title>([^<]+)</title>\", page)\n    title = html.unescape(t.group(1)).split(\" | \")[0].strip() if t else s\n    if title.lower() in cat:\n        skips.append(s + \": 이름 중복 \" + title); continue\n    au = re.search(r\"Submitted by.{0,300}?<a[^>]*>([^<]+)</a>\", page, re.S)\n    if not au:\n        skips.append(s + \": 제작자 파싱 실패\"); continue\n    author = html.unescape(au.group(1)).strip()\n    zl = re.findall(r'href=\"((?:https?://opengameart\\.org)?/sites/default/files/[^\"]+\\.zip)\"', page)\n    if not zl:\n        skips.append(s + \": zip 첨부 없음\"); continue\n    zurl = urllib.parse.urljoin(\"https://opengameart.org/\", html.unescape(zl[0]))\n    try:\n        data = get(zurl)\n    except Exception as ex:\n        skips.append(s + \": zip 다운로드 실패\"); continue\n    if len(data) > 5 * 1024 * 1024:\n        skips.append(s + \": zip \" + str(len(data)) + \"B 5MB 초과(Releases 미구현)\"); continue\n    try:\n        names = zipfile.ZipFile(io.BytesIO(data)).namelist()\n    except Exception:\n        skips.append(s + \": zip 열기 실패\"); continue\n    if not any(n.lower().endswith((\".glb\", \".gltf\", \".obj\", \".fbx\", \".blend\", \".dae\")) for n in names):\n        skips.append(s + \": 3D 파일 없음\"); continue\n    lic = \" / \".join(toks)\n    files = [\n        (s + \"/\" + s + \".zip\", data),\n        (s + \"/pack.md\", (\"# \" + title + \"\\n\\n- 종류: 3D (로우폴리 후보)\\n- 라이선스: \" + lic + \"\\n- 출처: \" + src + \"\\n- 제작자: \" + author + \"\\n- 수집일: \" + TODAY + \"\\n- AI 생성: 출처 페이지에 표기 없음\\n- 파일: \" + s + \".zip (zip 내 \" + str(len(names)) + \"개 항목)\\n\").encode()),\n        (s + \"/LICENSE-SOURCE.txt\", (\"title: \" + title + \"\\nauthor: \" + author + \"\\nsource_url: \" + src + \"\\nlicense: \" + lic + \"\\nchecked_at: \" + TODAY + \" (출처 페이지 License(s) 파싱)\\nzip: \" + s + \".zip\\n\").encode()),\n        (s + \"/CREDITS.txt\", (title + \" by \" + author + \" / \" + lic + \" / \" + src + \"\\n\").encode()),\n    ]\n    lt = lic_text_url(toks[0])\n    ltxt = None\n    if lt:\n        try: ltxt = get(lt)\n        except Exception: ltxt = None\n    if ltxt is None:\n        ltxt = (\"라이선스 전문 미확보. 원문: \" + src + \"\\n\").encode()\n    files.append((s + \"/LICENSE.txt\", ltxt))\n    base = api(\"GET\", \"/repos/\" + REPO + \"/git/ref/heads/main\")[\"object\"][\"sha\"]\n    btree = api(\"GET\", \"/repos/\" + REPO + \"/git/commits/\" + base)[\"tree\"][\"sha\"]\n    items = []\n    for path, content in files:\n        b = api(\"POST\", \"/repos/\" + REPO + \"/git/blobs\", {\"content\": base64.b64encode(content).decode(), \"encoding\": \"base64\"})\n        items.append({\"path\": path, \"mode\": \"100644\", \"type\": \"blob\", \"sha\": b[\"sha\"]})\n    tr = api(\"POST\", \"/repos/\" + REPO + \"/git/trees\", {\"base_tree\": btree, \"tree\": items})\n    cm = api(\"POST\", \"/repos/\" + REPO + \"/git/commits\", {\"message\": \"에셋: \" + title + \" 추가\", \"tree\": tr[\"sha\"], \"parents\": [base]})\n    api(\"PATCH\", \"/repos/\" + REPO + \"/git/refs/heads/main\", {\"sha\": cm[\"sha\"]})\n    added.append(s)\n    print(\"ADDED\", s, \"|\", title, \"|\", lic, \"|\", author, \"|\", src, \"|\", len(data), \"B |\", cm[\"sha\"])\n\nprint(\"SKIPPED\", len(skips))\nfor x in skips[:120]: print(\"SKIP\", x)\nprint(\"RESULT_ADDED\", len(added), \",\".join(added))\n\nPY\n"}]}}}
