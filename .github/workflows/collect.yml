{"name":"collect","on":{"workflow_dispatch":{"inputs":{"source":{"description":"polyhaven | kaykit","required":true,"type":"choice","options":["polyhaven","kaykit"],"default":"polyhaven"},"max_packs":{"description":"packs per run","required":false,"type":"string","default":"1"},"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":true}}}},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":25,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"collect","env":{"SRC":"${{ inputs.source }}","MAXP":"${{ inputs.max_packs }}","DRY":"${{ inputs.dry_run }}","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 - <<'PY'\nimport os, io, re, json, zipfile, subprocess, urllib.request, datetime\nSRC = os.environ.get('SRC', 'polyhaven')\nMAXP = int(os.environ.get('MAXP', '1'))\nDRY = os.environ.get('DRY', 'true') == 'true'\nREPO = 'sigco3111/assets-3d-lowpoly-2'\nUA = {'User-Agent': 'Mozilla/5.0 asset-collector'}\nTODAY = datetime.date.today().isoformat()\nSUM = []\ndef log(s):\n    print(s)\n    SUM.append(s)\ndef get(url, text=False):\n    req = urllib.request.Request(url, headers=UA)\n    with urllib.request.urlopen(req, timeout=300) as r:\n        d = r.read()\n    return d.decode('utf-8', 'replace') if text else d\ndef gj(url):\n    return json.loads(get(url, True))\ndef wb(path, data):\n    with open(path, 'wb') as f:\n        f.write(data if isinstance(data, bytes) else data.encode('utf-8'))\nCAT = get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv', True).decode('utf-8', 'replace').lower()\ndef in_catalog(slug):\n    return re.search(r'(?<![a-z0-9_.-])' + re.escape(slug.lower()) + r'(?![a-z0-9_.-])', CAT) is not None\ndef safe(s):\n    return re.sub(r'[^a-z0-9.-]+', '-', s.lower()).strip('-')\ndef cands_polyhaven():\n    d = gj('https://api.polyhaven.com/assets?t=models')\n    for slug, info in sorted(d.items(), key=lambda kv: -int(kv[1].get('download_count', 0) or 0)):\n        yield {'slug': slug, 'prefix': 'polyhaven', 'title': 'Poly Haven ' + str(info.get('name', slug)), 'src': 'https://polyhaven.com/a/' + slug, 'lic': 'CC0', 'thumb': info.get('thumbnail_url'), 'quote': 'All assets (HDRIs, textures and 3D models) on this site ... are licensed as CC0 (polyhaven.com/license, 2026-11-17 확인)', 'exts': ('.gltf', '.glb')}\ndef fetch_polyhaven(c):\n    f = gj('https://api.polyhaven.com/files/' + c['slug'])\n    g = ((f.get('gltf') or {}).get('1k') or {}).get('gltf')\n    if not g:\n        raise Exception('gltf 1k 없음')\n    main = g['url']\n    parts = [(os.path.basename(main.split('?')[0]), main)]\n    seen = set(p[0] for p in parts)\n    for rel, v in (g.get('include') or {}).items():\n        if rel in seen or '..' in rel:\n            continue\n        seen.add(rel)\n        parts.append((rel, v['url']))\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as z:\n        for rel, url in parts:\n            z.writestr(rel, get(url))\n    return buf.getvalue()\ndef cands_kaykit():\n    rs = gj('https://api.github.com/orgs/KayKit-Game-Assets/repos?per_page=100')\n    for r in sorted(rs, key=lambda r: -int(r.get('stargazers_count', 0) or 0)):\n        if r.get('fork') or r.get('archived'):\n            continue\n        lic = None; quote = ''\n        try:\n            t = get('https://raw.githubusercontent.com/KayKit-Game-Assets/%s/%s/LICENSE.txt' % (r['name'], r.get('default_branch') or 'main'), True).decode('utf-8', 'replace')\n            if 'Zero' in t or 'CC0' in t:\n                lic = 'CC0'; quote = t[:300].replace('\\n', ' ')\n        except Exception as e:\n            quote = 'LICENSE.txt 읽기 실패: %s' % e\n        yield {'slug': r['name'], 'prefix': 'kaykit', 'title': 'KayKit ' + r['name'], 'src': r['html_url'], 'lic': lic, 'thumb': None, 'quote': quote, 'exts': ('.gltf', '.glb', '.fbx', '.obj', '.blend'), 'repo': r['name'], 'branch': r.get('default_branch') or 'main'}\ndef fetch_kaykit(c):\n    return get('https://codeload.github.com/KayKit-Game-Assets/%s/zip/refs/heads/%s' % (c['repo'], c['branch']))\ndef cc0_text():\n    try:\n        return get('https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt', True).decode('utf-8', 'replace')\n    except Exception as e:\n        return 'CC0 1.0 전문 가져오기 실패(%s). https://creativecommons.org/publicdomain/zero/1.0/legalcode' % e\nCANDS = {'polyhaven': cands_polyhaven, 'kaykit': cands_kaykit}[SRC]()\nFETCH = {'polyhaven': fetch_polyhaven, 'kaykit': fetch_kaykit}[SRC]\ndone = 0; seen = 0\nfor c in CANDS:\n    if done >= MAXP or seen >= 80:\n        break\n    seen += 1\n    folder = c['prefix'] + '-' + safe(c['slug'])\n    if in_catalog(c['slug']):\n        log('SKIP %s: 포털 catalog에 이미 있음' % c['slug']); continue\n    if os.path.exists(folder):\n        log('SKIP %s: 폴더 이미 있음' % folder); continue\n    if not c.get('lic'):\n        log('SKIP %s: 라이선스 확인 실패 (%s)' % (c['slug'], c.get('quote', '')[:80])); continue\n    if DRY:\n        log('CANDIDATE %s | %s | %s | %s' % (folder, c['title'], c['lic'], c['src'])); done += 1; continue\n    try:\n        zb = FETCH(c)\n    except Exception as e:\n        log('SKIP %s: 다운로드 실패 %s' % (c['slug'], e)); continue\n    names = zipfile.ZipFile(io.BytesIO(zb)).namelist()\n    if not any(n.lower().endswith(e) for n in names for e in c['exts']):\n        log('SKIP %s: 모델 파일 형식 없음' % c['slug']); continue\n    size = len(zb)\n    if size > 25 * 1024 * 1024:\n        log('SKIP %s: 25MB 초과 (%d bytes)' % (c['slug'], size)); continue\n    zname = folder + '.zip'\n    os.makedirs(folder, exist_ok=True)\n    if size > 5 * 1024 * 1024:\n        tag = 'pack-' + folder\n        wb('/tmp/' + zname, zb)\n        subprocess.run(['gh', 'release', 'create', tag, '/tmp/' + zname, '--repo', REPO, '--title', c['title'], '--notes', 'Asset pack zip (5MB 초과, Releases 보관)'], check=True)\n        where = 'https://github.com/%s/releases/download/%s/%s' % (REPO, tag, zname)\n    else:\n        wb(os.path.join(folder, zname), zb)\n        where = '저장소 트리 ' + folder + '/' + zname\n    if c.get('thumb'):\n        try:\n            wb(os.path.join(folder, 'preview.png'), get(c['thumb']))\n        except Exception as e:\n            log('NOTE preview 실패 %s' % e)\n    lic_text = cc0_text() if c['lic'] == 'CC0' else c.get('quote', '')\n    wb(os.path.join(folder, 'LICENSE.txt'), lic_text)\n    wb(os.path.join(folder, 'LICENSE-SOURCE.txt'), 'Source: %s\\nLicense: %s\\nChecked: %s (GitHub Actions runner)\\nQuote: %s\\n' % (c['src'], c['lic'], TODAY, c.get('quote', '')))\n    wb(os.path.join(folder, 'pack.md'), '# %s\\n\\n- 라이선스: %s\\n- 출처: %s\\n- 수집일: %s (collect.yml, 자동)\\n- 파일: %s (%d bytes)\\n- 저장: %s\\n- AI 생성: 아니오\\n' % (c['title'], c['lic'], c['src'], TODAY, zname, size, where))\n    subprocess.run(['git', 'config', 'user.name', 'asset-collector'], check=True)\n    subprocess.run(['git', 'config', 'user.email', 'asset-collector@users.noreply.github.com'], check=True)\n    subprocess.run(['git', 'add', folder], check=True)\n    subprocess.run(['git', 'commit', '-m', '에셋: %s 추가' % c['title']], check=True)\n    subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)\n    log('ADDED %s | %s | %s | %s | %d bytes | %s' % (folder, c['title'], c['lic'], c['src'], size, where))\n    done += 1\nlog('DONE dry=%s src=%s added_or_candidates=%d scanned=%d' % (DRY, SRC, done, seen))\nsp = os.environ.get('GITHUB_STEP_SUMMARY')\nif sp:\n    with open(sp, 'a') as f:\n        f.write('\\n'.join(SUM) + '\\n')\nPY\n"}]}}}
