name: tmp-t8v-ambient
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: add ambientCG 9 packs (1K)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          while IFS='|' read -r ID NAME ZIPNAME SLUG KIND REL; do
            [ -z "$ID" ] && continue
            mkdir -p "$SLUG"
            curl -fsSL -o "$SLUG/$SLUG.zip" "https://ambientcg.com/get?file=$ZIPNAME" < /dev/null
            curl -fsSL -o "$SLUG/preview.png" "https://acg-media.struffelproductions.com/file/ambientCG-Web/media/thumbnail/512-PNG/$ID.png" < /dev/null
            if [ "$REL" = "release" ]; then
              mv "$SLUG/$SLUG.zip" "/tmp/rel/$SLUG.zip"
              gh release create "pack-$SLUG" "/tmp/rel/$SLUG.zip" --repo "$GITHUB_REPOSITORY" --title "pack-$SLUG" --notes "ambientCG $ID (CC0)" < /dev/null
              FILE="release:pack-$SLUG/$SLUG.zip"
            else
              FILE="$SLUG/$SLUG.zip"
            fi
            python3 - "$ID" "$NAME" "$SLUG" "$FILE" "$KIND" <<'PY'
          import json, sys, datetime
          ID, NAME, SLUG, FILE, KIND = sys.argv[1:6]
          tags = "texture,ambientcg,pbr,cc0" if KIND == "텍스처" else "hdri,ambientcg,cc0"
          d = {"name": "ambientCG " + NAME, "slug": SLUG, "zip": SLUG + ".zip", "file": FILE,
               "author": "ambientCG", "url": "https://ambientcg.com/a/" + ID, "license": "CC0",
               "attr": NAME + " by ambientCG (https://ambientcg.com/a/" + ID + "), CC0",
               "date": "2026-11-27", "tags": tags,
               "notes": "ambientCG 1K " + ("JPG" if KIND == "텍스처" else "HDRI") + " 팩 (docs.ambientcg.com/license 확인, CC0)",
               "preview": "preview.png", "kind": KIND}
          open(SLUG + "/meta.json", "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=1) + "\n")
          PY
          done <<'LIST'
          Fabric086|Fabric 086|Fabric086_1K-JPG.zip|ambientcg-fabric086|텍스처|release
          Bricks113B|Bricks 113 B|Bricks113B_1K-JPG.zip|ambientcg-bricks113b|텍스처|release
          NightEnvironmentHDRI011|Night Environment HDRI 011|NightEnvironmentHDRI011_1K.zip|ambientcg-nightenvironmenthdri011|HDRI|repo
          EveningSkyHDRI049A|Evening Sky HDRI 049 A|EveningSkyHDRI049A_1K.zip|ambientcg-eveningskyhdri049a|HDRI|repo
          EveningSkyHDRI049B|Evening Sky HDRI 049 B|EveningSkyHDRI049B_1K.zip|ambientcg-eveningskyhdri049b|HDRI|repo
          DaySkyHDRI072A|Day Sky HDRI 072 A|DaySkyHDRI072A_1K.zip|ambientcg-dayskyhdri072a|HDRI|repo
          DaySkyHDRI072B|Day Sky HDRI 072 B|DaySkyHDRI072B_1K.zip|ambientcg-dayskyhdri072b|HDRI|repo
          DayEnvironmentHDRI113|Day Environment HDRI 113|DayEnvironmentHDRI113_1K.zip|ambientcg-dayenvironmenthdri113|HDRI|repo
          DayEnvironmentHDRI114|Day Environment HDRI 114|DayEnvironmentHDRI114_1K.zip|ambientcg-dayenvironmenthdri114|HDRI|repo
          LIST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ambientcg-fabric086 ambientcg-bricks113b ambientcg-nightenvironmenthdri011 ambientcg-eveningskyhdri049a ambientcg-eveningskyhdri049b ambientcg-dayskyhdri072a ambientcg-dayskyhdri072b ambientcg-dayenvironmenthdri113 ambientcg-dayenvironmenthdri114
          git commit -m "카탈로그: ambientCG 9팩 수집 (tmp-t8v, 1K, CC0)"
          git pull --rebase origin main
          git push origin HEAD:main
